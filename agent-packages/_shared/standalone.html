<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PM Agent</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f6;color:#1e2429;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}main{max-width:900px;margin:auto;padding:34px 18px 80px}header{border-bottom:1px solid #d8dde0;padding-bottom:20px}h1{font-size:25px;margin:7px 0}header p{color:#66717a;line-height:1.6}form{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:24px 0}.field{display:grid;gap:6px}.wide{grid-column:1/-1}label{font-size:12px;font-weight:650}input,textarea,select{border:1px solid #cdd3d8;background:white;border-radius:5px;padding:10px;font:inherit;letter-spacing:0}textarea{min-height:100px}button{border:0;border-radius:5px;background:#20262b;color:white;padding:11px 15px;font-weight:700;cursor:pointer}.secondary{background:#fff;color:#20262b;border:1px solid #cdd3d8}.status{font-size:11px;color:#66717a;align-self:center}.result{background:white;border-top:3px solid #176b55;padding:20px}.result pre{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.55;max-height:560px;overflow:auto}.meta{font-size:11px;color:#66717a}.question{background:#fff8df;border:1px solid #e3cb82;padding:14px;margin-bottom:14px}.question input{width:100%;margin-top:6px}.actions{display:flex;gap:8px;margin-top:12px}@media(max-width:640px){form{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><main><header><div class="meta" id="meta">正在读取 Package</div><h1 id="name">PM Agent</h1><p id="mission"></p></header><form id="form"><div class="field"><label>运行模式</label><select id="mode"></select></div><div class="field"><label>本地材料路径</label><input id="materials" placeholder="PRD.md, demo.html"></div><div id="fields" class="wide" style="display:grid;grid-template-columns:1fr 1fr;gap:14px"></div><span class="status" id="status"></span><button type="submit">开始运行</button></form><section id="result"></section></main><script>
let pkg,currentTask;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
fetch('/api/package').then(r=>r.json()).then(d=>{pkg=d.package;document.title=pkg.name;$('#name').textContent=pkg.name;$('#mission').textContent=pkg.mission;$('#meta').textContent=pkg.id+' · '+pkg.version+' · '+(d.gateway.configured?d.gateway.model+' · '+d.gateway.reasoning_effort:'网关未配置');$('#mode').innerHTML=pkg.modes.map(x=>`<option value="${x.id}">${esc(x.label)}</option>`).join('');$('#fields').innerHTML=pkg.inputs.map(x=>`<div class="field ${x.type==='textarea'||x.type==='files'?'wide':''}"><label>${esc(x.label)}${x.required?' *':''}</label>${x.type==='textarea'?`<textarea data-id="${x.id}" ${x.required?'required':''}></textarea>`:`<input data-id="${x.id}" ${x.required?'required':''}>`}</div>`).join('')});
function render(task){currentTask=task;const pending=(task.input_requests||[]).find(x=>x.status==='pending');const approval=(task.approvals||[]).find(x=>x.status==='pending');let action='';if(pending)action=`<div class="question"><b>Agent 需要补充信息</b><p>${esc(pending.reason)}</p>${pending.questions.map(q=>`<label>${esc(q.label)}<input data-q="${q.id}"></label>`).join('')}<div class="actions"><button data-input="${pending.id}">提交并继续</button></div></div>`;if(approval)action=`<div class="question"><b>Agent 等待批准</b><p>${esc(approval.approval_type)}</p><div class="actions"><button data-approval="${approval.id}" data-value="true">批准</button><button class="secondary" data-approval="${approval.id}" data-value="false">拒绝</button></div></div>`;$('#status').textContent=task.status;$('#result').innerHTML=`<article class="result"><div class="meta">${esc(task.id)} · ${esc(task.status)}</div>${action}<pre>${esc(JSON.stringify(task.result||{events:task.events||[]},null,2))}</pre></article>`;document.querySelectorAll('[data-input]').forEach(b=>b.onclick=async()=>{const responses={};document.querySelectorAll('[data-q]').forEach(i=>responses[i.dataset.q]=i.value);await update({action:'provide_input',input_id:b.dataset.input,responses})});document.querySelectorAll('[data-approval]').forEach(b=>b.onclick=()=>update({action:'decide_approval',approval_id:b.dataset.approval,approved:b.dataset.value==='true'}))}
async function update(body){$('#status').textContent='继续运行中';const r=await fetch('/api/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task_id:currentTask.id,...body})});const d=await r.json();if(!d.ok)throw new Error(d.error);render(d.task)}
$('#form').onsubmit=async e=>{e.preventDefault();$('#status').textContent='AgentEngine 运行中';const inputs={};document.querySelectorAll('[data-id]').forEach(x=>inputs[x.dataset.id]=x.value);try{const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:$('#mode').value,inputs,material_paths:$('#materials').value.split(',').map(x=>x.trim()).filter(Boolean)})});const d=await r.json();if(!d.ok)throw new Error(d.error);render(d.task)}catch(err){$('#status').textContent='运行失败';$('#result').innerHTML=`<article class="result"><pre>${esc(err.message)}</pre></article>`}}
</script></body></html>
