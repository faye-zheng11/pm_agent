<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PM 工作台</title>
  <style>
    :root {
      --ink: #202a28;
      --muted: #697672;
      --line: #dfe5df;
      --paper: #ffffff;
      --canvas: #f5f5f1;
      --sidebar: #202a28;
      --sidebar-ink: #f6f5ef;
      --teal: #176b63;
      --teal-soft: #dff0eb;
      --coral: #bd654b;
      --coral-soft: #f6e3dc;
      --gold: #a97823;
      --gold-soft: #f7edd4;
      --slate-soft: #e9eeed;
      --danger: #a6423e;
      --shadow: 0 12px 35px rgba(32, 42, 40, .07);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--canvas); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { letter-spacing: 0; }
    button, input, textarea, select { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid rgba(23,107,99,.32); outline-offset: 2px; }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 248px minmax(0, 1fr); }
    .sidebar { position: sticky; top: 0; height: 100vh; padding: 24px 16px 18px; background: var(--sidebar); color: var(--sidebar-ink); display: flex; flex-direction: column; }
    .brand { padding: 2px 10px 25px; border-bottom: 1px solid rgba(255,255,255,.14); }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; margin-bottom: 14px; background: var(--coral); color: #fff; font-weight: 800; border-radius: 9px; }
    .brand h1 { margin: 0; font-size: 18px; letter-spacing: -.2px; }
    .brand p { margin: 6px 0 0; color: #acbbb5; font-size: 12px; line-height: 1.5; }
    .side-label { margin: 25px 10px 8px; color: #8fa09a; font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .side-more { margin-top: 25px; }
    .side-more summary { padding: 0 10px 8px; color: #8fa09a; cursor: pointer; font-size: 11px; font-weight: 700; letter-spacing: .08em; list-style: none; }
    .side-more summary::-webkit-details-marker { display: none; }
    .side-more summary::after { content: '＋'; float: right; font-size: 13px; }
    .side-more[open] summary::after { content: '−'; }
    .nav { display: grid; gap: 4px; }
    .nav button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 11px; border: 0; border-radius: 9px; background: transparent; color: #d6e0dc; text-align: left; font-size: 13px; }
    .nav button:hover { background: rgba(255,255,255,.08); }
    .nav button.active { background: #f6f5ef; color: var(--ink); font-weight: 700; }
    .nav-icon { width: 18px; color: #93b7af; font-size: 15px; text-align: center; }
    .nav button.active .nav-icon { color: var(--teal); }
    .side-foot { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid rgba(255,255,255,.12); color: #91a09b; font-size: 11px; line-height: 1.65; }
    .main { min-width: 0; }
    .topbar { position: sticky; top: 0; z-index: 20; min-height: 72px; padding: 13px clamp(18px, 4vw, 48px); border-bottom: 1px solid var(--line); background: rgba(245,245,241,.95); backdrop-filter: blur(8px); display: flex; align-items: center; gap: 14px; }
    .mobile-menu { display: none; }
    .project-picker { display: flex; align-items: center; gap: 10px; min-width: 270px; }
    .project-picker label { color: var(--muted); font-size: 11px; font-weight: 700; }
    select, input, textarea { border: 1px solid #cfd9d4; border-radius: 8px; background: var(--paper); color: var(--ink); outline: none; }
    select:focus, input:focus, textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(23,107,99,.12); }
    .project-picker select { min-width: 190px; height: 40px; padding: 0 12px; font-weight: 700; }
    .top-meta { display: flex; align-items: center; gap: 15px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
    .top-meta strong { color: var(--ink); font-weight: 700; }
    .gateway { margin-left: auto; display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #aebbb5; }
    .status-dot.ok { background: #31926e; }
    .status-dot.warn { background: #c38b2b; }
    .content { width: min(1320px, 100%); margin: 0 auto; padding: 38px clamp(18px, 4vw, 48px) 70px; }
    .view { display: none; }
    .view.active { display: block; }
    .eyebrow { margin: 0 0 9px; color: var(--teal); font-size: 11px; font-weight: 800; letter-spacing: .11em; }
    .page-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 22px; }
    .page-title h2 { margin: 0; font-size: clamp(25px, 3vw, 38px); line-height: 1.12; letter-spacing: -.6px; }
    .page-title p { max-width: 700px; margin: 11px 0 0; color: var(--muted); line-height: 1.65; font-size: 14px; }
    .title-action { display: flex; gap: 9px; flex-wrap: wrap; justify-content: flex-end; }
    .button { min-height: 44px; padding: 0 15px; border: 1px solid #cbd7d2; border-radius: 8px; background: var(--paper); color: var(--ink); font-size: 13px; font-weight: 700; }
    .button:hover { border-color: var(--teal); color: var(--teal); }
    .button.primary { border-color: var(--teal); background: var(--teal); color: #fff; }
    .button.primary:hover { background: #10564f; }
    .button.ghost { background: transparent; }
    .button.small { min-height: 36px; padding: 0 10px; font-size: 12px; }
    .button:disabled { cursor: wait; opacity: .55; }
    .status-chip { display: inline-flex; align-items: center; min-height: 27px; padding: 0 9px; border-radius: 20px; background: var(--slate-soft); color: #50625d; font-size: 11px; font-weight: 800; white-space: nowrap; }
    .status-chip.ok { background: var(--teal-soft); color: #176b63; }
    .status-chip.warn { background: var(--gold-soft); color: #8b641d; }
    .status-chip.bad { background: var(--coral-soft); color: var(--danger); }
    .hero { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, .65fr); gap: 18px; margin-top: 28px; }
    .hero-panel { min-height: 238px; padding: 26px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); box-shadow: var(--shadow); }
    .hero-panel.primary-panel { background: #eaf3ef; border-color: #cfe1da; }
    .hero-panel h3 { margin: 0; font-size: 23px; letter-spacing: -.3px; }
    .hero-panel p { margin: 11px 0 0; color: var(--muted); line-height: 1.65; font-size: 13px; }
    .hero-panel .action-row { margin-top: 25px; }
    .summary-list { display: grid; gap: 13px; margin-top: 19px; }
    .summary-item { display: grid; grid-template-columns: 75px minmax(0,1fr); gap: 12px; padding-bottom: 12px; border-bottom: 1px solid #e5ebe6; font-size: 13px; }
    .summary-item:last-child { padding-bottom: 0; border-bottom: 0; }
    .summary-item span { color: var(--muted); }
    .summary-item strong { min-width: 0; overflow-wrap: anywhere; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 36px 0 14px; }
    .section-head h3 { margin: 0; font-size: 17px; }
    .section-head p { margin: 0; color: var(--muted); font-size: 12px; }
    .agent-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
    .agent-card { min-height: 205px; padding: 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); display: flex; flex-direction: column; transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease; }
    .agent-card:hover { transform: translateY(-2px); border-color: #b8cdc6; box-shadow: var(--shadow); }
    .agent-card.teal { border-top: 4px solid var(--teal); }
    .agent-card.coral { border-top: 4px solid var(--coral); }
    .agent-card.gold { border-top: 4px solid var(--gold); }
    .agent-card .card-top { display: flex; justify-content: space-between; align-items: start; gap: 9px; }
    .agent-card h4 { margin: 0; font-size: 17px; }
    .agent-card .english { margin-top: 4px; color: var(--muted); font-size: 10px; letter-spacing: .04em; }
    .agent-card p { margin: 16px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .agent-card .card-foot { margin-top: auto; padding-top: 18px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .link-button { padding: 0; border: 0; background: transparent; color: var(--teal); font-weight: 800; font-size: 12px; }
    .link-button:hover { text-decoration: underline; }
    .lower-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(290px, .9fr); gap: 18px; }
    .panel { padding: 21px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
    .panel h3 { margin: 0; font-size: 15px; }
    .panel-sub { margin: 6px 0 16px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .activity-list { display: grid; }
    .activity { display: grid; grid-template-columns: 8px minmax(0,1fr) auto; gap: 12px; align-items: center; min-height: 57px; border-top: 1px solid #edf0ed; font-size: 13px; }
    .activity:first-child { border-top: 0; }
    .activity .mark { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); }
    .activity .detail { min-width: 0; }
    .activity strong, .activity small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .activity small { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .material-summary { display: grid; gap: 10px; }
    .material-mini { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid #edf0ed; font-size: 12px; }
    .material-mini:first-child { border-top: 0; }
    .material-mini span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .material-mini small { flex: 0 0 auto; color: var(--muted); }
    .agent-page { margin-top: 0; }
    .agent-intro { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
    .agent-intro h2 { margin: 0; font-size: 31px; letter-spacing: -.4px; }
    .agent-intro p { max-width: 760px; margin: 10px 0 0; color: var(--muted); line-height: 1.65; font-size: 14px; }
    .agent-workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(290px, .62fr); gap: 18px; margin-top: 22px; }
    .form-panel { padding: 23px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
    .form-panel h3 { margin: 0 0 18px; font-size: 15px; }
    .mode-tabs { display: flex; gap: 6px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 3px; }
    .mode-tabs button { flex: 0 0 auto; min-height: 35px; padding: 0 11px; border: 1px solid var(--line); border-radius: 20px; background: var(--canvas); color: var(--muted); font-size: 12px; font-weight: 700; }
    .mode-tabs button.active { border-color: var(--teal); background: var(--teal-soft); color: var(--teal); }
    .mode-select { width: 100%; min-height: 42px; margin-bottom: 20px; padding: 10px 11px; }
    .field { margin-bottom: 16px; }
    .field label { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 7px; font-size: 13px; font-weight: 800; }
    .field label small { color: var(--muted); font-weight: 400; font-size: 11px; }
    .field textarea, .field input, .field select { width: 100%; min-height: 42px; padding: 10px 11px; }
    .field textarea { min-height: 116px; resize: vertical; line-height: 1.55; }
    .field textarea.short { min-height: 76px; }
    .checkbox-line { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .checkbox-line input { width: 16px; min-height: 16px; }
    .form-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 21px; padding-top: 17px; border-top: 1px solid #edf0ed; }
    .form-footer small { color: var(--muted); font-size: 11px; line-height: 1.45; }
    .context-panel { display: grid; gap: 13px; align-content: start; }
    .context-panel .panel { padding: 18px; }
    .context-panel h4 { margin: 0 0 8px; font-size: 13px; }
    .context-panel p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .tool-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .tool-tag { padding: 5px 8px; border-radius: 5px; background: var(--slate-soft); color: #586a65; font-size: 11px; }
    .tool-tag.off { background: var(--coral-soft); color: var(--danger); }
    .result-panel { margin-top: 20px; border: 1px solid #c9ddd5; border-radius: 12px; background: #fcfffd; overflow: hidden; }
    .result-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 19px; border-bottom: 1px solid #dfece6; }
    .result-head strong { font-size: 14px; }
    .result-body { padding: 19px; }
    .result-body h3 { margin: 0 0 10px; font-size: 20px; }
    .result-body p, .result-body li { color: #485b55; line-height: 1.65; font-size: 13px; }
    .result-body ul { margin: 8px 0 0; padding-left: 20px; }
    .result-body details { margin-top: 16px; }
    .result-body summary { color: var(--teal); cursor: pointer; font-size: 12px; font-weight: 800; }
    .result-body pre { max-height: 420px; margin: 10px 0 0; padding: 14px; border: 1px solid #dfe8e3; border-radius: 7px; background: #f4f7f5; color: #52635e; font-size: 11px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; overflow: auto; }
    .timeline { display: grid; gap: 9px; color: var(--muted); font-size: 12px; }
    .timeline div { padding-left: 12px; border-left: 2px solid #cfe1da; line-height: 1.5; }
    .question-box { padding: 15px; border: 1px solid #e2cb8c; border-radius: 8px; background: #fff9e9; }
    .question-box h4 { margin: 0 0 8px; font-size: 14px; }
    .question-box p { margin: 0 0 10px; }
    .question-box label { display: block; margin-top: 10px; color: var(--muted); font-size: 12px; }
    .question-box input { width: 100%; min-height: 37px; margin-top: 5px; padding: 8px; }
    .project-page { margin-top: 0; }
    .project-context-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(310px, .72fr); gap: 18px; margin-top: 24px; }
    .project-info { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-top: 17px; }
    .metric { padding: 15px; border: 1px solid var(--line); border-radius: 9px; background: #fbfcfa; }
    .metric span, .metric strong { display: block; }
    .metric span { color: var(--muted); font-size: 11px; }
    .metric strong { margin-top: 7px; font-size: 16px; overflow-wrap: anywhere; }
    .upload-zone { padding: 18px; border: 1px dashed #adc4bb; border-radius: 9px; background: #f6fbf8; }
    .upload-zone h4 { margin: 0 0 7px; font-size: 14px; }
    .upload-zone p { margin: 0 0 15px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .upload-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .upload-actions label { display: inline-flex; align-items: center; min-height: 36px; padding: 0 10px; border: 1px solid #cbd7d2; border-radius: 7px; background: #fff; color: var(--ink); font-size: 12px; font-weight: 700; cursor: pointer; }
    .upload-actions input { display: none; }
    .source-list { display: grid; gap: 0; margin-top: 15px; }
    .source-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid #edf0ed; font-size: 12px; }
    .source-row strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .source-row small { flex: 0 0 auto; color: var(--muted); }
    .analysis { min-height: 250px; padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: #fafbf9; white-space: pre-wrap; word-break: break-word; color: #52635e; font-size: 12px; line-height: 1.65; }
    .workflow-page { margin-top: 0; }
    .workflow-layout { display: grid; grid-template-columns: minmax(0, .75fr) minmax(0, 1.25fr); gap: 18px; margin-top: 24px; }
    .flow-list { display: grid; gap: 0; }
    .flow-step { display: grid; grid-template-columns: 29px minmax(0,1fr); gap: 12px; padding: 14px 0; border-top: 1px solid #edf0ed; }
    .flow-step:first-child { border-top: 0; }
    .step-num { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 50%; background: var(--teal-soft); color: var(--teal); font-size: 11px; font-weight: 800; }
    .flow-step strong, .flow-step small { display: block; }
    .flow-step strong { font-size: 13px; }
    .flow-step small { margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .artifact-list { margin-top: 24px; }
    .artifact-row { display: grid; grid-template-columns: minmax(0, 1fr) 100px 160px; gap: 12px; align-items: center; padding: 14px 16px; border-top: 1px solid #edf0ed; font-size: 12px; }
    .artifact-row:first-child { border-top: 0; }
    .artifact-row code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .artifact-row span { color: var(--muted); }
    .source-row, .artifact-row, .dashboard-row { cursor: pointer; }
    .document-page { max-width: 980px; margin: 0 auto; }
    .document-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 20px; }
    .document-head h2 { margin: 0; font-size: clamp(24px, 3vw, 36px); line-height: 1.2; overflow-wrap: anywhere; }
    .document-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; color: var(--muted); font-size: 11px; }
    .document-meta span { padding: 5px 8px; border-radius: 7px; background: var(--slate-soft); }
    .document-body { min-height: 260px; padding: clamp(20px, 4vw, 38px); border: 1px solid var(--line); border-radius: 16px; background: var(--paper); box-shadow: var(--shadow); }
    .document-markdown { color: #41514d; font-size: 14px; line-height: 1.8; }
    .document-markdown h1, .document-markdown h2, .document-markdown h3 { color: var(--ink); line-height: 1.35; }
    .document-markdown h1 { margin: 0 0 20px; font-size: 28px; }
    .document-markdown h2 { margin: 27px 0 10px; font-size: 21px; border-bottom: 1px solid #edf0ed; padding-bottom: 7px; }
    .document-markdown h3 { margin: 20px 0 7px; font-size: 17px; }
    .document-markdown p { margin: 9px 0; }
    .document-markdown ul { margin: 8px 0; padding-left: 22px; }
    .document-markdown blockquote { margin: 13px 0; padding: 9px 14px; border-left: 3px solid var(--coral); background: var(--coral-soft); color: #6a4b55; }
    .document-markdown code { padding: 2px 5px; border-radius: 5px; background: #f0f4f2; font-size: 12px; }
    .document-code { margin: 0; max-height: 70vh; overflow: auto; white-space: pre-wrap; word-break: break-word; color: #40504c; font: 12px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .document-frame { width: 100%; min-height: 620px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .document-image { display: block; max-width: 100%; max-height: 72vh; margin: 0 auto; border-radius: 10px; object-fit: contain; }
    .document-external { display: grid; gap: 13px; padding: 18px; border: 1px solid #eadde1; border-radius: 12px; background: #fff8f9; color: #6f5b63; line-height: 1.65; }
    .document-external a { overflow-wrap: anywhere; color: var(--teal); font-weight: 800; }
    .document-empty { padding: 48px 10px; color: var(--muted); text-align: center; line-height: 1.7; }
    .modal { position: fixed; inset: 0; z-index: 90; display: none; place-items: center; padding: 20px; background: rgba(24,33,30,.56); }
    .modal.open { display: grid; }
    .dialog { width: min(520px, 100%); padding: 24px; border: 1px solid var(--line); border-radius: 13px; background: var(--paper); box-shadow: 0 20px 70px rgba(0,0,0,.2); }
    .dialog h3 { margin: 0 0 18px; font-size: 19px; }
    .dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .toast { position: fixed; right: 22px; bottom: 22px; z-index: 120; display: none; max-width: 420px; padding: 12px 15px; border-radius: 8px; background: var(--ink); color: #fff; font-size: 12px; line-height: 1.5; box-shadow: var(--shadow); }
    .toast.show { display: block; }
    .empty { padding: 22px 0; color: var(--muted); text-align: center; font-size: 12px; }
    @media (max-width: 1000px) { .shell { grid-template-columns: 218px minmax(0,1fr); } .hero, .project-context-grid, .workflow-layout { grid-template-columns: 1fr; } .agent-workspace { grid-template-columns: 1fr; } }
    @media (max-width: 780px) { .shell { display: block; } .sidebar { position: fixed; inset: 56px auto 0 0; z-index: 60; width: 248px; height: auto; display: none; box-shadow: 12px 0 30px rgba(0,0,0,.18); } body.nav-open .sidebar { display: flex; } .mobile-menu { display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); font-size: 18px; } .topbar { min-height: 56px; padding: 9px 14px; } .project-picker { min-width: 0; flex: 1; } .project-picker label { display: none; } .project-picker select { min-width: 0; width: 100%; } .top-meta { display: none; } .gateway { display: none; } .content { padding: 28px 14px 50px; } .page-title, .agent-intro { display: block; } .title-action { justify-content: flex-start; margin-top: 17px; } .agent-grid { grid-template-columns: 1fr; } .lower-grid { grid-template-columns: 1fr; } .project-info { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 520px) { .hero-panel { padding: 20px; } .page-title h2 { font-size: 27px; } .form-footer { align-items: stretch; flex-direction: column; } .form-footer .button { width: 100%; } .project-info { grid-template-columns: 1fr; } .artifact-row { grid-template-columns: minmax(0,1fr) 70px; } .artifact-row span:last-child { display: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; } .agent-card:hover { transform: none; } }

    /* Warm studio layer: the workbench should feel like a place for product judgement, not a generic admin shell. */
    :root { --ink: #2d2630; --muted: #81757c; --line: #eadfe2; --paper: #fffdfb; --canvas: #f8f1ee; --sidebar: #352b39; --sidebar-ink: #fff8f6; --teal: #4b827b; --teal-soft: #e4f0eb; --coral: #dc6680; --coral-soft: #fbe2e7; --gold: #c99435; --gold-soft: #f9efd8; --shadow: 0 18px 50px rgba(87, 55, 68, .10); }
    html, body { background: var(--canvas); color: var(--ink); }
    .shell { grid-template-columns: 264px minmax(0, 1fr); }
    .sidebar { padding: 27px 18px 20px; background: var(--sidebar); border-right: 1px solid rgba(255,255,255,.08); }
    .brand { padding: 2px 12px 28px; border-bottom-color: rgba(255,255,255,.15); }
    .brand-mark { width: 42px; height: 42px; margin-bottom: 16px; border-radius: 13px; background: #f5a8b9; color: #5d3246; font-size: 14px; box-shadow: 0 8px 18px rgba(226,122,151,.20); }
    .brand h1 { font-size: 20px; letter-spacing: -.4px; }
    .brand p { color: #cdbec5; line-height: 1.65; }
    .side-label { margin: 28px 12px 10px; color: #c4aeb9; letter-spacing: .12em; }
    .side-more { margin-top: 27px; }
    .side-more summary { padding-left: 12px; color: #c4aeb9; }
    .nav { gap: 7px; }
    .nav button { min-height: 46px; padding: 0 13px; border-radius: 12px; color: #e6dce1; }
    .nav button:hover { background: rgba(255,255,255,.08); }
    .nav button.active { background: #fff8f5; color: #372c38; box-shadow: 0 7px 18px rgba(0,0,0,.10); }
    .nav-icon { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 8px; color: #ef9eb2; background: rgba(255,255,255,.07); }
    .nav button.active .nav-icon { color: #fff; background: var(--coral); }
    .side-foot { padding: 17px 12px 0; color: #bdaeb6; border-top-color: rgba(255,255,255,.14); }
    .topbar { min-height: 78px; padding: 14px clamp(22px, 4vw, 56px); background: rgba(255,253,251,.93); border-bottom-color: var(--line); }
    .project-picker label { color: #9c8991; }
    select, input, textarea { border-color: #e3d5da; background: #fffdfc; border-radius: 11px; }
    select:focus, input:focus, textarea:focus { border-color: var(--coral); box-shadow: 0 0 0 3px rgba(220,102,128,.14); }
    .project-picker select { height: 44px; border-radius: 12px; }
    .button { min-height: 44px; padding: 0 17px; border-color: #e2d4d8; border-radius: 12px; background: #fffdfb; }
    .button:hover { border-color: var(--coral); color: var(--coral); }
    .button.primary { border-color: var(--coral); background: var(--coral); box-shadow: 0 8px 18px rgba(220,102,128,.19); }
    .button.primary:hover { background: #c9516c; }
    .button.small { border-radius: 10px; }
    .content { padding-top: 46px; }
    .eyebrow { color: var(--coral); letter-spacing: .14em; }
    .page-title h2 { font-size: clamp(28px, 3vw, 42px); letter-spacing: -.9px; }
    .page-title p { color: #83757d; }
    .hero { gap: 20px; margin-top: 31px; }
    .hero-panel { min-height: 245px; padding: 29px; border-color: var(--line); border-radius: 20px; background: var(--paper); box-shadow: var(--shadow); }
    .hero-panel.primary-panel { background: #f5dfe5; border-color: #efc3ce; }
    .hero-panel h3 { font-size: 26px; letter-spacing: -.6px; }
    .summary-list { gap: 14px; }
    .summary-item { border-bottom-color: #efe1e4; }
    .section-head { margin-top: 41px; }
    .section-head h3 { font-size: 18px; letter-spacing: -.2px; }
    .agent-grid { gap: 16px; }
    .agent-card { min-height: 220px; padding: 22px; border-color: var(--line); border-radius: 18px; box-shadow: 0 8px 24px rgba(87,55,68,.045); }
    .agent-card:hover { transform: translateY(-3px); border-color: #e2a7b5; box-shadow: var(--shadow); }
    .agent-card.teal { border-top: 0; border-left: 5px solid var(--teal); }
    .agent-card.coral { border-top: 0; border-left: 5px solid var(--coral); }
    .agent-card.gold { border-top: 0; border-left: 5px solid var(--gold); }
    .agent-card h4 { font-size: 18px; }
    .agent-card p { color: #7e7279; }
    .panel, .form-panel { border-color: var(--line); border-radius: 18px; background: var(--paper); box-shadow: 0 8px 24px rgba(87,55,68,.035); }
    .activity { border-top-color: #f0e5e7; }
    .activity .mark { background: var(--coral); }
    .material-mini { border-top-color: #f0e5e7; }
    .agent-intro { border-bottom-color: var(--line); }
    .agent-intro h2 { letter-spacing: -.6px; }
    .mode-select { border-radius: 11px; border-color: #e2d4d8; }
    .tool-tag { border-radius: 8px; background: #f4e9ed; color: #765764; }
    .tool-tag.off { background: var(--coral-soft); color: #ad4a63; }
    .result-panel { border-color: #efc8d2; border-radius: 18px; background: #fffafa; }
    .result-head { border-bottom-color: #f2dfe3; }
    .result-body pre { border-color: #eedfe3; background: #fff5f7; }
    .question-box { border-color: #efd39d; border-radius: 13px; background: #fff8e9; }
    .upload-zone { border-color: #e1aab8; border-radius: 15px; background: #fff4f5; }
    .metric { border-color: var(--line); border-radius: 13px; background: #fff9f8; }
    .analysis { border-color: var(--line); border-radius: 12px; background: #fffafa; }
    .flow-step { border-top-color: #f0e5e7; }
    .step-num { background: var(--coral-soft); color: var(--coral); }

    .task-pet { position: fixed; right: 22px; bottom: 22px; z-index: 110; display: grid; justify-items: end; gap: 10px; }
    .pet-button { position: relative; width: 82px; height: 82px; padding: 6px; border: 1px solid #f1c6d0; border-radius: 50%; background: #fffaf9; box-shadow: 0 15px 35px rgba(116,52,75,.22); transition: transform .18s ease, box-shadow .18s ease; }
    .pet-button:hover, .task-pet.open .pet-button { transform: translateY(-3px) rotate(-2deg); box-shadow: 0 19px 40px rgba(116,52,75,.28); }
    .task-pet[data-state="running"] .pet-button { animation: pet-nudge 2.5s ease-in-out infinite; }
    .pet-image { display: block; width: 100%; height: 100%; border-radius: 50%; background-image: url('assets/pm-rabbit-states.png'); background-size: 200% 200%; background-position: 0 0; background-repeat: no-repeat; }
    .task-pet[data-state="complete"] .pet-image { background-position: 100% 0; }
    .task-pet[data-state="waiting"] .pet-image { background-position: 0 100%; }
    .task-pet[data-state="failed"] .pet-image { background-position: 100% 100%; }
    .pet-badge { position: absolute; top: -3px; right: -2px; min-width: 23px; height: 23px; display: grid; place-items: center; padding: 0 6px; border: 3px solid var(--canvas); border-radius: 20px; background: var(--coral); color: white; font-size: 10px; font-weight: 800; }
    .task-pet[data-count="0"] .pet-badge { display: none; }
    .task-pet-panel { display: none; width: min(370px, calc(100vw - 28px)); max-height: min(520px, calc(100vh - 135px)); overflow: auto; padding: 16px; border: 1px solid #efd3d9; border-radius: 20px; background: #fffdfc; box-shadow: 0 20px 60px rgba(80,40,57,.22); }
    .task-pet.open .task-pet-panel { display: block; }
    .pet-panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-bottom: 13px; border-bottom: 1px solid #f0e2e5; }
    .pet-panel-head strong, .pet-panel-head small { display: block; }
    .pet-panel-head strong { font-size: 15px; }
    .pet-panel-head small { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .pet-clear { padding: 0; border: 0; background: transparent; color: var(--coral); font-size: 11px; font-weight: 800; }
    .pet-task-list { display: grid; gap: 8px; margin-top: 12px; }
    .pet-task { width: 100%; display: grid; grid-template-columns: 8px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 11px 10px; border: 1px solid #f1e5e7; border-radius: 12px; background: #fffafa; color: var(--ink); text-align: left; }
    .pet-task:hover { border-color: #e4a9b7; background: #fff3f5; }
    .pet-task-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
    .pet-task-dot.complete { background: var(--teal); }
    .pet-task-dot.failed { background: var(--coral); }
    .pet-task-copy { min-width: 0; }
    .pet-task-copy strong, .pet-task-copy small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pet-task-copy strong { font-size: 12px; }
    .pet-task-copy small { margin-top: 4px; color: var(--muted); font-size: 10px; }
    .pet-task-status { color: var(--muted); font-size: 10px; white-space: nowrap; }
    .pet-empty { padding: 20px 5px 7px; color: var(--muted); text-align: center; font-size: 12px; line-height: 1.6; }
    @keyframes pet-nudge { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(3deg) translateY(-2px); } }
    .upload-actions-v2 { display: flex; flex-wrap: wrap; gap: 8px; }
    .upload-actions-v2 label { display: inline-flex; align-items: center; min-height: 42px; padding: 0 13px; border: 1px solid #e2b4bf; border-radius: 11px; background: #fffdfc; color: #633d4d; font-size: 12px; font-weight: 800; cursor: pointer; }
    .upload-actions-v2 label:hover { border-color: var(--coral); background: #fff4f6; }
    .upload-actions-v2 input { display: none; }
    .upload-note { margin-top: 11px; color: #967e86; font-size: 11px; line-height: 1.55; }
    .upload-queue { margin-top: 14px; padding: 12px; border: 1px solid #f0dce0; border-radius: 12px; background: #fffafb; }
    .upload-queue-head { display: flex; justify-content: space-between; gap: 10px; color: #6c515b; font-size: 11px; font-weight: 800; }
    .upload-queue-list { display: grid; gap: 6px; max-height: 180px; margin-top: 9px; overflow: auto; }
    .upload-queue-item { display: flex; justify-content: space-between; gap: 10px; color: #76666d; font-size: 11px; }
    .upload-queue-item span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .upload-queue-item span:last-child { flex: 0 0 auto; color: #a18e95; }
    .source-link-box { display: grid; gap: 8px; margin-top: 16px; padding-top: 15px; border-top: 1px solid #f0e1e4; }
    .source-link-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
    .source-link-row input { width: 100%; min-height: 42px; padding: 10px 11px; }
    .source-link-box small { color: #967e86; font-size: 11px; line-height: 1.5; }
    .quick-options { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .quick-chip { border: 1px solid #ead8de; border-radius: 999px; padding: 6px 9px; background: #fff; color: #78636b; cursor: pointer; font: inherit; font-size: 11px; }
    .quick-chip:hover, .quick-chip.selected { border-color: #d88ca2; background: #fff0f4; color: #9b4966; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .two-col label { display: grid; gap: 7px; }
    .result-structured { display: grid; gap: 14px; }
    .result-hero { display: grid; gap: 4px; padding: 16px 18px; border: 1px solid #eadbe0; border-radius: 16px; background: linear-gradient(135deg,#fff7f8,#fff); }
    .result-hero strong { color: #342832; font-size: 18px; line-height: 1.45; }
    .result-hero small { color: #967e86; }
    .result-kicker { color: #c65f7d; font-size: 10px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
    .result-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
    .result-block { padding: 13px 14px; border: 1px solid #eee2e4; border-radius: 14px; background: #fff; }
    .result-block-head { display: flex; justify-content: space-between; color: #58444d; font-size: 12px; font-weight: 900; }
    .result-block-head em { color: #b69ca5; font-size: 10px; font-style: normal; }
    .result-list { display: grid; gap: 8px; margin: 10px 0 0; padding-left: 18px; color: #6f5b63; font-size: 12px; line-height: 1.55; }
    .result-risk { background: #fff9f7; border-color: #f4ddd5; }
    .result-evidence { background: #f9fbff; border-color: #dfe8f4; }
    .result-next { background: #fbfaf5; border-color: #eee4c8; }
    .result-artifacts { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; color: #806c73; font-size: 11px; }
    .result-artifacts code { padding: 5px 8px; border-radius: 8px; background: #f6eef1; color: #775463; }
    .profile-line { display: grid; gap: 4px; padding: 10px 0; border-bottom: 1px solid #f1e7e9; color: #79666d; font-size: 12px; line-height: 1.5; }
    .profile-line strong, .profile-memory strong { color: #4d3b43; font-size: 11px; }
    .profile-memory { display: grid; gap: 7px; padding-top: 13px; color: #79666d; font-size: 11px; line-height: 1.5; }
    .profile-memory div { padding: 8px 9px; border-radius: 9px; background: #fff8f9; }
    #topBet { display: inline-block; max-width: 180px; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; white-space: nowrap; }
    .shaper-intake { display: grid; gap: 18px; }
    .shaper-intake-head { display: grid; gap: 6px; }
    .shaper-intake-head strong { color: #342832; font-size: 18px; }
    .shaper-intake-head span { color: #8e7981; font-size: 12px; line-height: 1.55; }
    .shaper-start-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 9px; }
    .shaper-start-card { display: grid; gap: 7px; min-height: 102px; padding: 13px; border: 1px solid #eadde1; border-radius: 14px; background: #fff; color: #5e4b54; text-align: left; cursor: pointer; font: inherit; }
    .shaper-start-card:hover, .shaper-start-card.active { border-color: #d77892; background: #fff3f6; box-shadow: 0 8px 18px rgba(174,95,121,.1); }
    .shaper-start-card strong { color: #44333b; font-size: 13px; }
    .shaper-start-card span { color: #907d84; font-size: 11px; line-height: 1.45; }
    .shaper-prompt-row { display: none; }
    .shaper-prompt { border: 1px solid #eadde1; border-radius: 999px; padding: 7px 10px; background: #fff; color: #795f69; cursor: pointer; font: inherit; font-size: 11px; }
    .shaper-prompt:hover { border-color: #d77892; background: #fff3f6; color: #a04b69; }
    .shaper-context { display: grid; gap: 8px; padding: 12px 13px; border: 1px solid #e6edf2; border-radius: 13px; background: #f9fbfd; }
    .shaper-context-head { display: flex; justify-content: space-between; gap: 10px; color: #526875; font-size: 11px; font-weight: 800; }
    .shaper-context-copy { color: #79909b; font-size: 11px; line-height: 1.5; }
    .shaper-progress { display: grid; grid-template-columns: repeat(6,minmax(0,1fr)); gap: 6px; }
    .shaper-progress-step { display: grid; gap: 6px; min-width: 0; color: #9d8991; font-size: 10px; line-height: 1.3; }
    .shaper-progress-step i { display: block; height: 4px; border-radius: 99px; background: #eadfe2; }
    .shaper-progress-step.active { color: #9d4f69; font-weight: 800; }
    .shaper-progress-step.active i { background: #d97894; }
    .shaper-progress-step.done i { background: #95c9bd; }
    .shaper-advanced { border-top: 1px solid #f0e4e7; padding-top: 12px; }
    .shaper-advanced summary { color: #8d737d; cursor: pointer; font-size: 11px; font-weight: 800; }
    .agent-page:has(.shaper-intake) .context-panel .panel:first-child { display: none; }
    .workboard { display:grid; gap:13px; margin-top:16px; }
    .workboard-head { display:flex; justify-content:space-between; align-items:end; gap:12px; }
    .workboard-head h3 { margin:0; color:#43343c; font-size:15px; }
    .workboard-head p { margin:4px 0 0; color:#9a858d; font-size:11px; }
    .workboard-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
    .workboard-column { min-width:0; padding:10px; border:1px solid #eee2e5; border-radius:13px; background:#fffafb; }
    .workboard-column h4 { display:flex; justify-content:space-between; gap:6px; margin:0 0 8px; color:#765f68; font-size:11px; }
    .workboard-column h4 span { color:#b69ca5; font-weight:500; }
    .workboard-list { display:grid; gap:7px; min-height:38px; }
    .workboard-item { width:100%; display:grid; gap:5px; padding:9px; border:1px solid #f0e2e5; border-radius:10px; background:#fff; color:#57444d; text-align:left; cursor:pointer; font:inherit; }
    .workboard-item:hover { border-color:#d78098; background:#fff4f6; }
    .workboard-item strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11px; }
    .workboard-item small { overflow:hidden; color:#9a858d; text-overflow:ellipsis; white-space:nowrap; font-size:10px; }
    .workboard-empty { color:#b09da4; font-size:10px; }
    .workboard-actions { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .workboard-kill { border:0; background:transparent; color:#c35d73; cursor:pointer; font-size:10px; }
    .workboard-kill:hover { text-decoration:underline; }
    .workline-panel { display:grid; gap:16px; margin-top:20px; padding:20px; border:1px solid #ead9df; border-radius:18px; background:#fffdfc; box-shadow:0 10px 30px rgba(111,72,88,.06); }
    .workline-head { display:flex; justify-content:space-between; align-items:start; gap:16px; }
    .workline-head h3 { margin:0; color:#3f3039; font-size:17px; line-height:1.45; }
    .workline-head p { margin:5px 0 0; color:#947e87; font-size:11px; line-height:1.55; }
    .workline-stage { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:6px; }
    .workline-stage-item { display:grid; gap:6px; min-width:0; color:#a58f97; font-size:10px; line-height:1.3; }
    .workline-stage-item i { height:5px; border-radius:99px; background:#eee3e6; }
    .workline-stage-item.done { color:#6d9e95; font-weight:800; }
    .workline-stage-item.done i { background:#a9d2c9; }
    .workline-stage-item.active { color:#a04f69; font-weight:800; }
    .workline-stage-item.active i { background:#d97894; }
    .workline-section { display:grid; gap:9px; }
    .workline-section > strong { color:#54414a; font-size:13px; }
    .workline-section > small { color:#9b858d; font-size:11px; line-height:1.5; }
    .workline-cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; }
    .workline-card { display:grid; gap:6px; min-width:0; padding:12px; border:1px solid #eee0e4; border-radius:13px; background:#fff; }

    .workline-card-label { color:#9b7a86; font-size:10px; font-weight:800; }
    .workline-card strong { color:#55414a; font-size:12px; line-height:1.45; }
    .workline-card span { color:#806b74; font-size:11px; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere; }
    .workline-next { padding:12px 13px; border:1px solid #e1ebf0; border-radius:13px; background:#f8fbfd; color:#6f8791; font-size:11px; line-height:1.55; }
    .conversation { display:grid; gap:9px; }

    .conversation-item.agent { justify-self:start; border-color:#dce9ef; background:#f8fbfd; }
    .conversation-item.system { justify-self:start; max-width:100%; border-style:dashed; background:#fffaf5; }
    .conversation-label { color:#a05b72; font-size:10px; font-weight:900; }
    .conversation-item.agent .conversation-label { color:#62818d; }
    .conversation-item.system .conversation-label { color:#a48249; }
    .conversation-question { color:#5d4a52; font-size:11px; line-height:1.55; }
    .conversation-answer { padding-top:5px; border-top:1px solid rgba(181,126,145,.18); color:#765d67; font-size:11px; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere; }
    .workline-detail { display:grid; gap:10px; }
    .workline-detail summary { color:#977f88; cursor:pointer; font-size:11px; }
    .workline-detail pre { max-height:320px; overflow:auto; margin:0; padding:12px; border-radius:11px; background:#fbf7f8; color:#6f5962; font-size:10px; white-space:pre-wrap; }
    .ux-review-builder { display:grid; gap:16px; padding:16px; border:1px solid #eadce1; border-radius:16px; background:#fffafb; }
    .ux-review-builder-head { display:grid; gap:5px; }
    .ux-review-builder-head strong { color:#493640; font-size:14px; }
    .ux-review-builder-head span, .ux-review-note { color:#927d86; font-size:11px; line-height:1.55; }
    .ux-review-section { display:grid; gap:8px; }
    .ux-review-section > label { color:#5a444d; font-size:12px; font-weight:900; }
    .ux-review-section > small { color:#a08b93; font-size:10px; line-height:1.45; }
    .ux-scope-select, .ux-evidence-select { width:100%; min-height:42px; padding:9px 11px; border:1px solid #eadde1; border-radius:11px; background:#fff; color:#604c55; font:inherit; font-size:12px; }
    .ux-audience-groups { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .ux-audience-group { display:grid; gap:8px; padding:11px; border:1px solid #eee0e4; border-radius:12px; background:#fff; }
    .ux-audience-group h4 { margin:0; color:#6a515b; font-size:11px; }
    .ux-audience-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; }
    .ux-audience-option { display:grid; gap:3px; width:100%; padding:9px 10px; border:1px solid #eee1e4; border-radius:10px; background:#fff; color:#715b64; text-align:left; cursor:pointer; font:inherit; }
    .ux-audience-option:hover, .ux-audience-option.selected { border-color:#d77d96; background:#fff1f5; }
    .ux-audience-option strong { color:#54404a; font-size:11px; }
    .ux-audience-option span { color:#9a858d; font-size:10px; line-height:1.45; }
    .ux-audience-summary { padding:10px 11px; border-radius:10px; background:#f8fbfd; color:#6f8791; font-size:11px; line-height:1.55; }
    .ux-review-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .ux-review-grid label { display:grid; gap:7px; color:#5a444d; font-size:11px; font-weight:800; }
    .project-dashboard { display:grid; gap:22px; }
    .dashboard-intro { display:flex; justify-content:space-between; gap:22px; align-items:end; }
    .dashboard-intro h2 { margin:5px 0 7px; }
    .dashboard-intro p { max-width:680px; }
    .dashboard-actions { display:flex; flex-wrap:wrap; gap:8px; }
    .dashboard-status { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px; }
    .dashboard-stat { padding:14px; border:1px solid #eee1e4; border-radius:13px; background:#fff; }
    .dashboard-stat span { display:block; color:#a08b93; font-size:10px; }
    .dashboard-stat strong { display:block; margin-top:7px; overflow:hidden; color:#49363f; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
    .dashboard-grid { display:grid; grid-template-columns:1.15fr .85fr; gap:14px; }
    .dashboard-section { min-width:0; }
    .dashboard-section h3 { margin:0 0 9px; color:#4b3942; font-size:15px; }
    .dashboard-section > p { margin:-3px 0 10px; color:#9a858d; font-size:11px; }
    .dashboard-list { display:grid; gap:7px; }
    .dashboard-row { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:11px 12px; border:1px solid #eee2e4; border-radius:11px; background:#fff; }
    .dashboard-row-main { min-width:0; }
    .dashboard-row strong, .dashboard-row small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .dashboard-row strong { color:#5a444e; font-size:12px; }
    .dashboard-row small { margin-top:4px; color:#a08b93; font-size:10px; }
    .dashboard-row button { flex:0 0 auto; }
    .dashboard-empty { padding:18px 12px; border:1px dashed #eadde1; border-radius:11px; color:#a08b93; font-size:11px; line-height:1.55; }
    .signal-row { align-items:start; }
    .signal-score { flex:0 0 auto; color:#bd6b82; font-size:11px; font-weight:800; }
    .artifact-kind { color:#7ca69d !important; }
    @media (max-width: 920px) { .workboard-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .dashboard-grid { grid-template-columns:1fr; } }
    @media (max-width: 620px) { .dashboard-intro { display:grid; } .dashboard-status { grid-template-columns:repeat(2,minmax(0,1fr)); } .workboard-grid { grid-template-columns:1fr; } }
    @media (max-width: 760px) { .shaper-start-grid { grid-template-columns: 1fr; } .shaper-progress { grid-template-columns: repeat(3,minmax(0,1fr)); row-gap: 10px; } }
    @media (max-width: 780px) { .shell { display: block; } .sidebar { width: 264px; } .topbar { min-height: 60px; } .content { padding-top: 31px; } .task-pet { right: 14px; bottom: 14px; } .pet-button { width: 72px; height: 72px; } }
    @media (max-width: 620px) { .two-col, .result-grid, .workline-cards, .ux-audience-groups, .ux-audience-list, .ux-review-grid { grid-template-columns: 1fr; } .workline-stage { grid-template-columns: repeat(3,minmax(0,1fr)); row-gap:10px; } .workline-head { display:grid; } .conversation-item { max-width:100%; } }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">PM</div><h1>PM 工作台</h1><p>把想法推进成可以判断、可以验证、可以交付的产品。</p></div>
      <div class="side-label">工作台</div>
      <nav class="nav" id="nav-primary"></nav>
      <details class="side-more">
        <summary>更多工作</summary>
        <nav class="nav" id="nav-secondary"></nav>
      </details>
      <div class="side-foot">当前页面的运行、草稿、材料和历史都绑定当前项目。切换项目后会重新读取，不混用上下文。</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="menuButton" aria-label="打开导航">☰</button>
        <div class="project-picker"><label>项目</label><select id="projectSelect" aria-label="切换项目"></select><button class="button small" id="newProjectButton">新建</button></div>
        <div class="top-meta"><span>阶段 <strong id="topStage">-</strong></span><span>版本 <strong id="topVersion">-</strong></span><span>当前 Bet <strong id="topBet">未建立</strong></span></div>
        <div class="gateway"><span class="status-dot" id="gatewayDot"></span><span id="gatewayText">检查网关</span></div>
      </header>
      <div class="content">
        <section class="view" id="view-home"></section>
        <section class="view" id="view-project"></section>
        <section class="view" id="view-agent"></section>
        <section class="view" id="view-workflow"></section>
        <section class="view" id="view-artifacts"></section>
        <section class="view" id="view-material"></section>
      </div>
    </main>
  </div>
  <div class="task-pet" id="taskPet" data-state="ready" data-count="0">
    <div class="task-pet-panel" id="taskPetPanel" role="dialog" aria-label="Agent 任务通知">
      <div class="pet-panel-head"><div><strong>任务小兔</strong><small id="petPanelSubtitle">正在看当前项目</small></div><button class="pet-clear" id="petClear" type="button">全部标记已看</button></div>
      <div class="pet-task-list" id="petTaskList"></div>
    </div>
    <button class="pet-button" id="petButton" type="button" aria-label="打开 Agent 任务通知"><span class="pet-image" aria-hidden="true"></span><span class="pet-badge" id="petBadge">0</span></button>
  </div>
  <div class="modal" id="projectModal"><form class="dialog" id="projectForm"><h3>新建一个工作区</h3><div class="field"><label>项目 ID <small>正式项目使用小写字母、数字和连字符</small></label><input name="id" placeholder="idol-103"></div><div class="field"><label>项目名称</label><input name="name" required placeholder="我的新产品"></div><label class="checkbox-line"><input name="temporary" type="checkbox"> 先作为临时工作区，之后再决定是否正式建项目</label><div class="actions"><button type="button" class="button" id="cancelProject">取消</button><button class="button primary" type="submit">创建并进入</button></div></form></div>
  <div class="toast" id="toast"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const state = { projectId: params.get('project') || '', page: params.get('page') || 'home', taskId: params.get('task') || '', materialKey: params.get('material') || '', artifactPath: params.get('artifact') || '', catalog: null, project: null, overview: null, intake: null, tasks: [], runs: [], activeAgent: null, activeTask: null, activeRun: null, materials: [] };
    const $ = (selector, root = document) => root.querySelector(selector);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const agentMeta = {
      'product-shaper': { title: '做产品', english: 'PRODUCT SHAPER', tone: 'teal', short: '把一句想法收敛成一个能判断、能验证的产品方案。', intro: '从用户、问题和证据开始，明确做什么、不做什么，再形成 Bet、MVP、流程和下一步。', action: '开始塑形' },
      'user-experience-reviewer': { title: '用户试用', english: 'USER EXPERIENCE REVIEWER', tone: 'coral', short: '站到用户那边，找出理解、使用、信任和复访上的问题。', intro: '可以评审想法、产品方案、PRD、HTML Demo 或 Figma。模拟反应会明确标注，不替代真人验证。', action: '开始走查' },
      'independent-critic': { title: '独立评审', english: 'INDEPENDENT CRITIC', tone: 'gold', short: '用大白话判断：现在值不值得继续，问题到底出在哪里。', intro: '它不负责把方案做漂亮，而是检查需求是否成立、证据是否够、方案是否乱做，以及迭代是否真的解决了问题。', action: '开始评审' },
      'opportunity-researcher': { title: '找机会', english: 'OPPORTUNITY RESEARCHER', tone: 'teal', short: '从公开内容、竞品和用户信号中找值得验证的方向。', intro: '这是输入阶段的研究 Agent。它会保留来源和限制，不把热度直接当成需求。', action: '开始研究' }
    };
    const navPrimary = [['home','项目首页','⌂'],['product-shaper','做产品','↗'],['user-experience-reviewer','用户试用','◌'],['independent-critic','独立评审','✓']];
    const navSecondary = [['opportunity-researcher','找机会','⌕'],['workflow','完整流程','→'],['artifacts','产物','▤']];
    const runtimeToPackage = { opportunity_researcher: 'opportunity-researcher', product_shaper: 'product-shaper', user_experience_reviewer: 'user-experience-reviewer', independent_critic: 'independent-critic' };
    function toast(message) { const node = $('#toast'); node.textContent = message; node.classList.add('show'); clearTimeout(window.__toast); window.__toast = setTimeout(() => node.classList.remove('show'), 3400); }
    async function api(path, options = {}) { const headers = {'X-Project-ID': state.projectId, ...(options.headers || {})}; if (options.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json'; const response = await fetch(path, {...options, headers}); const data = await response.json().catch(() => ({error:'服务器返回无法解析'})); if (!response.ok) throw new Error(data.error || `请求失败 ${response.status}`); return data; }
    function go(page) { const url = new URL(location.href); url.searchParams.set('project', state.projectId); url.searchParams.set('page', page); url.searchParams.delete('task'); if (page !== 'material') { url.searchParams.delete('material'); url.searchParams.delete('artifact'); state.materialKey = ''; state.artifactPath = ''; } state.taskId = ''; state.activeTask = null; history.pushState({}, '', url); state.page = page; render(); window.scrollTo({top:0, behavior:'smooth'}); }
    function rememberTask(taskId) { state.taskId = taskId || ''; const url = new URL(location.href); if (state.taskId) url.searchParams.set('task', state.taskId); else url.searchParams.delete('task'); history.replaceState({}, '', url); }
    function chip(status) { const type = ['completed','可运行','已确认'].includes(status) ? 'ok' : ['failed','blocked'].includes(status) ? 'bad' : 'warn'; return `<span class="status-chip ${type}">${esc(status || '待确认')}</span>`; }
    function timeText(value) { if (!value) return '尚无记录'; const date = typeof value === 'number' ? new Date(value) : new Date(String(value).includes('T') ? value : String(value).replace(' ','T')); return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
    function setActiveView(id) { document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); $(`#view-${id}`).classList.add('active'); }
    function renderNav() { const render = (items, target) => { $(target).innerHTML = items.map(([id,label,icon]) => `<button class="${state.page===id?'active':''}" data-page="${id}"><span class="nav-icon">${icon}</span><span>${label}</span></button>`).join(''); $(target).querySelectorAll('[data-page]').forEach(button => button.onclick = () => { go(button.dataset.page); document.body.classList.remove('nav-open'); }); }; render(navPrimary, '#nav-primary'); render(navSecondary, '#nav-secondary'); }
    function seenNoticeIds() { try { return new Set(JSON.parse(localStorage.getItem(`pm-task-seen:${state.projectId}`) || '[]')); } catch (_) { return new Set(); } }
    function saveSeenNoticeIds(ids) { try { localStorage.setItem(`pm-task-seen:${state.projectId}`, JSON.stringify([...ids].slice(-120))); } catch (_) {} }
    function noticeStatus(status) { if (['waiting_input','waiting_approval'].includes(status)) return {state:'waiting', label:status === 'waiting_input' ? '等你补充' : '等你确认'}; if (['failed','blocked','cancelled'].includes(status)) return {state:'failed', label:status === 'blocked' ? '已阻塞' : status === 'cancelled' ? '已取消' : '失败'}; if (status === 'completed') return {state:'complete', label:'已完成'}; return {state:'running', label:status === 'retrying' ? '重试中' : '运行中'}; }
    function projectNotices() { const notices = []; const seen = seenNoticeIds(); const tasks = [...state.tasks]; if (state.activeTask && !tasks.some(task => task.id === state.activeTask.id)) tasks.unshift(state.activeTask); tasks.forEach(task => { const key = `task:${task.id}`; if (!task.id || seen.has(key)) return; const status = noticeStatus(task.status); notices.push({key, kind:'task', id:task.id, status:status.state, label:status.label, title:task.goal || task.task_type || 'Agent 任务', detail:`${agentMeta[runtimeToPackage[task.assigned_agent]]?.title || task.assigned_agent || 'Agent'} · ${timeText(task.updated_at || task.created_at)}`}); }); (state.runs || []).forEach(run => { const key = `workflow:${run.id}`; if (!run.id || seen.has(key) || ['completed','failed','blocked','cancelled'].includes(run.status) && seen.has(key)) return; const status = noticeStatus(run.status); notices.push({key, kind:'workflow', id:run.id, status:status.state, label:status.label, title:run.goal || '完整流程', detail:`完整流程 · ${timeText(run.updated_at || run.created_at)}`}); }); return notices.slice(0,12); }
    function renderTaskPet() { const root = $('#taskPet'); if (!root) return; const notices = projectNotices(); const priority = notices.some(item => item.status === 'failed') ? 'failed' : notices.some(item => item.status === 'waiting') ? 'waiting' : notices.some(item => item.status === 'complete') ? 'complete' : notices.length ? 'running' : 'ready'; root.dataset.state = priority; root.dataset.count = String(notices.length); $('#petBadge').textContent = String(notices.length); $('#petButton').setAttribute('aria-label', notices.length ? `打开任务通知，有 ${notices.length} 条需要关注` : '打开任务通知，当前没有未读任务'); $('#petPanelSubtitle').textContent = `${state.project?.name || '当前项目'} · ${notices.length ? `${notices.length} 条待看` : '暂时没有待看的运行'}`; $('#petTaskList').innerHTML = notices.length ? notices.map(item => `<button class="pet-task" type="button" data-notice-key="${esc(item.key)}" data-notice-kind="${esc(item.kind)}" data-notice-id="${esc(item.id)}"><span class="pet-task-dot ${item.status === 'complete' ? 'complete' : item.status === 'failed' ? 'failed' : ''}"></span><span class="pet-task-copy"><strong>${esc(item.title)}</strong><small>${esc(item.detail)}</small></span><span class="pet-task-status">${esc(item.label)} ›</span></button>`).join('') : '<div class="pet-empty">小兔现在很轻松。新的 Agent 任务完成、需要你确认或遇到问题时，会在这里提醒你。</div>'; }
    function dismissNotice(key) { const ids = seenNoticeIds(); ids.add(key); saveSeenNoticeIds(ids); renderTaskPet(); }
    async function openNotice(button) { const key = button.dataset.noticeKey; const kind = button.dataset.noticeKind; const id = button.dataset.noticeId; dismissNotice(key); $('#taskPet').classList.remove('open'); if (kind === 'workflow') { go('workflow'); return; } const page = runtimeToPackage[(state.tasks.find(task => task.id === id) || state.activeTask || {}).assigned_agent] || 'home'; go(page); try { const task = await api(`/api/agents/task?id=${encodeURIComponent(id)}`); state.activeTask = task; rememberTask(task.id); displayTask(task); } catch (error) { toast(error.message); } }
    function bindTaskPet() { $('#petButton').onclick = () => $('#taskPet').classList.toggle('open'); $('#petClear').onclick = () => { const ids = seenNoticeIds(); projectNotices().forEach(item => ids.add(item.key)); saveSeenNoticeIds(ids); renderTaskPet(); }; $('#petTaskList').onclick = event => { const button = event.target.closest('[data-notice-key]'); if (button) openNotice(button); }; document.addEventListener('click', event => { if (!event.target.closest('#taskPet')) $('#taskPet').classList.remove('open'); }); }
    function updateTop() { const project = state.project || {}; $('#topStage').textContent = stageLabel(project.stage); $('#topVersion').textContent = project.version || 'v0.1'; $('#topBet').textContent = project.active_bet || '未建立'; }
    function stageLabel(stage) { return ({discovery:'探索期',validation:'验证期',delivery:'交付期',iteration:'迭代期',maintenance:'维护期',temporary:'临时工作区'})[stage] || '待确认'; }
    function activeMaterials() { return state.overview?.materials?.items || []; }
    function materialRows(items, limit = 5) { if (!items.length) return '<div class="empty">还没有项目资料</div>'; return items.slice(0,limit).map(item => `<div class="material-mini"><span title="${esc(item.name || item.path || '')}">${esc(item.name || item.path || '未命名资料')}</span><small>${esc(item.kind || '本地资料')}</small></div>`).join(''); }
    function recentActivity() { const tasks = state.overview?.tasks || []; if (!tasks.length) return '<div class="empty">还没有运行记录。先选一张主牌开始。</div>'; return tasks.slice(0,5).map(task => `<div class="activity"><span class="mark"></span><div class="detail"><strong>${esc(task.goal || '未命名任务')}</strong><small>${esc(task.assigned_agent || task.task_type || 'Agent')} · ${timeText(task.updated_at || task.created_at)}</small></div>${chip(task.status)}</div>`).join(''); }
    function projectHeader(label, description) { return `<div class="page-title"><div><p class="eyebrow">${esc(label)}</p><h2>${esc(state.project?.name || '当前项目')}</h2><p>${esc(description)}</p></div></div>`; }
    function taskPage(task) { return runtimeToPackage[task?.assigned_agent] || 'home'; }
    function taskStatusGroup(status) { if (['queued','running','retrying'].includes(status)) return 'active'; if (['waiting_input','waiting_approval'].includes(status)) return 'waiting'; if (['completed','blocked','failed'].includes(status)) return 'closed'; return 'vetoed'; }
    function taskLabel(status) { return ({queued:'排队中',running:'运行中',retrying:'重试中',waiting_input:'等你补充',waiting_approval:'等你确认',completed:'已完成',blocked:'已阻塞',failed:'失败',cancelled:'PM 已否决'})[status] || status || '未知'; }
    function projectTasks() { return [...(state.tasks || [])].sort((a,b) => String(b.updated_at || b.created_at).localeCompare(String(a.updated_at || a.created_at))); }
    function openTask(taskId) { const task = projectTasks().find(item => item.id === taskId); if (!task) return; const page = taskPage(task); const url = new URL(location.href); url.searchParams.set('project', state.projectId); url.searchParams.set('page', page); url.searchParams.set('task', taskId); history.pushState({}, '', url); state.page = page; state.taskId = taskId; state.activeTask = task; render(); api(`/api/agents/task?id=${encodeURIComponent(taskId)}`).then(detail => { state.activeTask = detail; displayTask(detail); refreshShaperProgress(); }).catch(error => toast(error.message)); window.scrollTo({top:0, behavior:'smooth'}); }
    function taskBoardHtml(agentId) { const agent = state.catalog?.agents?.find(item => item.id === agentId); const tasks = projectTasks().filter(task => task.assigned_agent === agent?.runtime_agent_id); const groups = [['active','进行中'],['waiting','等你处理'],['closed','已结束'],['vetoed','PM 已否决']]; const groupHtml = groups.map(([group,label]) => { const items = tasks.filter(task => taskStatusGroup(task.status) === group).slice(0,12); return `<div class="workboard-column"><h4>${label}<span>${items.length}</span></h4><div class="workboard-list">${items.length ? items.map(task => `<div class="workboard-item" data-open-task="${esc(task.id)}"><strong>${esc(task.goal || task.task_type || '未命名工作线')}</strong><small>${esc(task.work_unit_id || task.work_unit || task.task_type || '')} · ${esc(timeText(task.updated_at || task.created_at))}</small><div class="workboard-actions"><span>${chip(task.status)}</span>${group === 'active' || group === 'waiting' ? `<button type="button" class="workboard-kill" data-kill-task="${esc(task.id)}">PM 否决</button>` : ''}</div></div>`).join('') : '<div class="workboard-empty">暂无工作线</div>'}</div></div>`; }).join(''); return `<section class="workboard"><div class="workboard-head"><div><h3>这个项目正在推进的工作线</h3><p>可以同时推进多个功能；离开页面不会丢失，点击任意一条即可回到原来的任务和对话。</p></div><span class="status-chip ok">${tasks.length} 条</span></div><div class="workboard-grid">${groupHtml}</div></section>`; }
    function bindTaskBoard(root = document) { root.querySelectorAll('[data-open-task]').forEach(item => item.onclick = event => { if (event.target.closest('[data-kill-task]')) return; openTask(item.dataset.openTask); }); root.querySelectorAll('[data-kill-task]').forEach(button => button.onclick = async event => { event.stopPropagation(); if (!window.confirm('确定关闭这条工作线吗？关闭后会标记为“PM 已否决”，原记录仍会保留。')) return; try { await api('/api/agents/update',{method:'POST',body:JSON.stringify({action:'cancel',task_id:button.dataset.killTask,note:'PM 否决并关闭这条工作线'})}); await loadProjectData(); render(); toast('这条工作线已关闭，原记录仍可查看。'); } catch (error) { toast(error.message); } }); }

    function extraFields(id) { const audiences = projectAudienceOptions(); if (id === 'product-shaper') return `<div class="field"><label>开工类型 <small>选一个即可</small></label><select name="phase"><option value="new">从新想法开工</option><option value="iteration">现有产品迭代</option><option value="feature">单个功能塑形</option><option value="version">整版本梳理</option></select>${quickOptions('phase',['新项目','现有产品迭代','单个功能','整版本梳理'])}</div><div class="field"><label>项目已有用户 / 当前问题 <small>可选</small></label><input name="context" placeholder="例如：重度粉丝；当前注册后第二天流失">${quickOptions('context',audiences.slice(0,2).concat(['当前项目资料']))}</div><div class="field"><label>希望先产出什么 <small>可选</small></label><select name="deliverable"><option>产品方案 + 可证伪 Bet</option><option>MVP 与功能优先级</option><option>核心流程与页面状态</option><option>PRD 前的待确认清单</option></select></div>`; if (id === 'user-experience-reviewer') return `<div class="field"><label>评审对象 <small>可选</small></label><select name="review_scope"><option value="feature">单个功能</option><option value="version">当前版本</option><option value="product">整个产品路径</option><option value="prd">PRD</option><option value="demo">HTML Demo</option><option value="figma">Figma</option></select>${quickOptions('review_scope',['单个功能','当前版本','整个产品路径'])}</div><div class="field"><label>模拟用户群 <small>可多选，默认使用当前项目人群</small></label><input name="users" value="${esc(audiences.slice(0,2).join('、'))}" placeholder="例如：唯粉、妈粉、海外用户、新用户">${quickOptions('users',['唯粉','团粉','妈粉','事业粉','CP粉','海外粉','新用户','高频回访用户','专业 UX 评审',...audiences])}</div><div class="field two-col"><label>地区<select name="region"><option>不确定</option><option>中国大陆</option><option>东南亚</option><option>日韩</option><option>欧美</option><option>全球</option></select></label><label>年龄<select name="age"><option>不确定</option><option>未成年风险视角</option><option>18-24 岁</option><option>25-34 岁</option><option>35 岁以上</option></select></label></div><div class="field"><label>最担心什么 <small>可选</small></label><textarea class="short" name="focus" placeholder="例如：用户是否理解这是 AI，是
