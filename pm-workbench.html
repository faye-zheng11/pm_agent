    async function startAgent(event) { event.preventDefault(); const form = new FormData(event.target); const id = state.activeAgent.id; const context = [form.get('context'), form.get('shaper_context') && `PM 已补充：${form.get('shaper_context')}`, form.get('constraints') && `约束：${form.get('constraints')}`, form.get('work_type') && `开工对象：${form.get('work_type')}`, form.get('users') && `目标用户：${form.get('users')}`, form.get('review_scope') && `评审对象：${form.get('review_scope')}`, form.get('critic_scope') && `独立评审对象：${form.get('critic_scope')}`, form.get('region') && `地区：${form.get('region')}`, form.get('age') && `年龄视角：${form.get('age')}`, form.get('focus') && `重点：${form.get('focus')}`, form.get('stage_context') && `阶段或版本：${form.get('stage_context')}`, form.get('phase') && `开工类型：${form.get('phase')}`, form.get('deliverable') && `期望产出：${form.get('deliverable')}`, form.get('research_mode') && `研究模式：${form.get('research_mode')}`, form.get('source_strategy') && `来源策略：${form.get('source_strategy')}`, form.get('materials') && `项目资料路径：${form.get('materials')}`].filter(Boolean).join('\n'); const goal = [form.get('goal'), context].filter(Boolean).join('\n\n'); const button = event.target.querySelector('button[type=submit]'); button.disabled = true; button.textContent = '正在启动…'; try { const out = await api('/api/agents/start',{method:'POST',body:JSON.stringify({agent_id:id, mode:form.get('mode'), goal, decision_to_support:form.get('decision') || (id === 'product-shaper' ? '帮助我明确下一步，并形成可以继续讨论或交给评审的产品草稿' : ''), source_artifacts: form.get('materials') ? form.get('materials').split(',').map(x=>x.trim()).filter(Boolean) : []})}); state.activeTask = out.task; rememberTask(out.task.id); displayTask(out.task); pollTask(out.task.id); } catch (error) { toast(error.message); } finally { button.disabled = false; button.textContent = `${agentMeta[id].action} →`; } }
    function displayTask(task) { const box = $('#agentResult'); if (!box) return; box.className = 'result-panel'; const pending = (task.input_requests || []).find(item => item.status === 'pending'); const approval = (task.approvals || []).find(item => item.status === 'pending'); const events = (task.events || []).slice(-8).map(event => `<div>${esc(event.kind)} · ${esc(event.at || '')}${event.details?.tool ? ` · ${esc(event.details.tool)}` : ''}</div>`).join(''); let action = ''; if (pending) action = `<div class="question-box"><h4>Agent 需要你补充一点信息</h4><p>${esc(pending.reason || '为了继续，需要几个关键答案。')}</p>${(pending.questions || []).map(question => `<label>${esc(question.label)}<input data-question="${esc(question.id)}" placeholder="${esc(question.description || '')}"></label>`).join('')}<button class="button primary small" data-input="${esc(pending.id)}" style="margin-top:13px">提交并继续</button></div>`; if (approval) action = `<div class="question-box"><h4>这里需要 PM 确认</h4><p>Agent 准备执行：${esc(approval.approval_type || '下一步动作')}</p><button class="button primary small" data-approve="${esc(approval.id)}" data-value="true">批准继续</button><button class="button small" data-approve="${esc(approval.id)}" data-value="false" style="margin-left:7px">暂不批准</button></div>`; const result = task.result; box.innerHTML = `<div class="result-head"><strong>${task.status === 'completed' ? '这次运行完成了' : 'Agent 运行中'}</strong>${chip(task.status)}</div><div class="result-body">${action}${result ? `<h3>${esc(result.summary || result.title || '已生成结构化结果')}</h3>${result.conclusions?.length ? `<ul>${result.conclusions.map(item => `<li>${esc(item.statement || item)}</li>`).join('')}</ul>` : ''}<pre>${esc(JSON.stringify(result,null,2))}</pre>` : `<div class="timeline">${events || '<div>任务已进入队列，正在读取当前项目上下文。</div>'}</div>`}</div>`; box.querySelectorAll('[data-input]').forEach(button => button.onclick = async () => { const responses = {}; box.querySelectorAll('[data-question]').forEach(input => responses[input.dataset.question] = input.value); await api('/api/agents/update',{method:'POST',body:JSON.stringify({action:'provide_input',task_id:task.id,input_id:button.dataset.input,responses})}); pollTask(task.id); }); box.querySelectorAll('[data-approve]').forEach(button => button.onclick = async () => { await api('/api/agents/update',{method:'POST',body:JSON.stringify({action:'decide_approval',task_id:task.id,approval_id:button.dataset.approve,approved:button.dataset.value==='true'})}); pollTask(task.id); }); }
    function worklineText(value, limit = 190) { const text = itemText(value).replace(/\s+/g, ' ').trim(); return text.length > limit ? `${text.slice(0, limit)}…` : text; }
    function worklineCard(label, value, pending = false) { return `<div class="workline-card ${pending ? 'pending' : ''}"><span class="workline-card-label">${esc(label)}</span><strong>${esc(pending ? '待补全' : label)}</strong><span>${esc(pending ? '这一步会在当前工作线里和你一起确认。' : worklineText(value))}</span></div>`; }
    function worklineStageIndex(task) { const result = task.result || {}; const shape = result.product_shape || result; if (shape.product_blueprint || shape.product_map) return 5; if (shape.bet_draft) return 4; if (shape.mvp_features || shape.core_flow || shape.information_architecture) return 3; if (shape.core_mechanism || shape.value_proposition || shape.product_direction) return 2; if (shape.target_users || shape.problem || shape.user_job) return 1; const provided = (task.input_requests || []).filter(item => item.status === 'provided').length; return Math.min(5, provided ? Math.max(1, provided) : 0); }
    function worklineCards(task, stage) { const cards = [worklineCard('起点想法', task.goal || '尚未记录')]; const requests = (task.input_requests || []).filter(item => item.status === 'provided'); requests.forEach(request => (request.questions || []).forEach(question => { const answer = request.responses?.[question.id]; if (answer !== undefined && answer !== null && String(answer).trim()) cards.push(worklineCard(question.label || question.id, answer)); })); const result = task.result?.product_shape || task.result || {}; [['目标用户',result.target_users || result.target_audience || result.user_job],['核心问题',result.problem || result.user_problem],['产品方向',result.product_direction || result.value_proposition || result.core_mechanism],['MVP 与功能',result.mvp_features || result.core_flow],['Bet 验证',result.bet_draft || result.bet],['产品蓝图',result.product_blueprint || result.product_map]].forEach(([label,value],index) => { if (value) cards.push(worklineCard(label,value)); else if (index <= stage + 1 && cards.length < 10) cards.push(worklineCard(label,'',true)); }); return cards.slice(0,12).join(''); }
    function worklineConversation(task) { const rows = [`<div class="conversation-item pm"><span class="conversation-label">PM · 开工输入</span><span class="conversation-question">${esc(worklineText(task.goal || '未填写任务内容', 320))}</span>${task.decision_to_support ? `<span class="conversation-answer">这次要支持的决定：${esc(worklineText(task.decision_to_support, 220))}</span>` : ''}</div>`]; (task.input_requests || []).forEach((request,index) => { const questions = request.questions || []; const answerMap = request.responses || {}; const hasAnswers = request.status === 'provided'; rows.push(`<div class="conversation-item agent"><span class="conversation-label">Agent · 第 ${index + 1} 轮追问</span><span class="conversation-question">${esc(worklineText(request.reason || '为了继续，需要补充这些信息。', 280))}</span>${questions.slice(0,8).map(question => { const answer = answerMap[question.id]; return `<span class="conversation-answer"><strong>${esc(question.label || question.id)}</strong><br>${esc(answer !== undefined && String(answer).trim() ? worklineText(answer, 260) : '等待 PM 回答')}</span>`; }).join('')}</div>`); if (hasAnswers) rows.push(`<div class="conversation-item pm"><span class="conversation-label">PM · 已提交第 ${index + 1} 轮回答</span><span class="conversation-question">${esc(questions.map(question => `${question.label || question.id}：${worklineText(answerMap[question.id] ?? '未填写', 180)}`).join('\n'))}</span></div>`); }); const eventRows = (task.events || []).filter(event => ['tool.completed','tool.failed','guardrail.blocked','verification.completed','task.failed'].includes(event.kind)).slice(-8).map(event => { const details = event.details || {}; const text = event.kind === 'tool.completed' ? `已读取或调用：${details.tool || '项目工具'}` : event.kind === 'verification.completed' ? '结构化结果已完成质量检查' : `${details.tool || '运行节点'}：${details.reason || event.kind}`; return `<div class="conversation-item system"><span class="conversation-label">运行记录 · ${esc(timeText(event.at))}</span><span class="conversation-question">${esc(text)}</span></div>`; }); return rows.concat(eventRows).join(''); }
    function displayTask(task) { const box = $('#agentResult'); if (!box) return; box.className = 'result-panel'; const pending = (task.input_requests || []).find(item => item.status === 'pending'); const approval = (task.approvals || []).find(item => item.status === 'pending'); const stage = worklineStageIndex(task); const stageLabels = ['想法接收','用户与问题','产品方向','MVP 与流程','Bet 验证','产品蓝图']; const stageHtml = stageLabels.map((label,index) => `<div class="workline-stage-item ${index < stage ? 'done' : ''} ${index === stage ? 'active' : ''}"><i></i><span>${label}</span></div>`).join(''); let action = ''; if (pending) action = `<div class="question-box"><h4>下一步：请补充这一轮信息</h4><p>${esc(pending.reason || '为了继续，需要几个关键答案。')}</p>${(pending.questions || []).map(question => `<label>${esc(question.label)}<input data-question="${esc(question.id)}" placeholder="${esc(question.description || '')}"></label>`).join('')}<button class="button primary small" data-input="${esc(pending.id)}" style="margin-top:13px">提交并继续</button></div>`; if (approval) action = `<div class="question-box"><h4>下一步：需要 PM 确认</h4><p>Agent 准备执行：${esc(approval.approval_type || '下一步动作')}</p><button class="button primary small" data-approve="${esc(approval.id)}" data-value="true">批准继续</button><button class="button small" data-approve="${esc(approval.id)}" data-value="false" style="margin-left:7px">暂不批准</button></div>`; const result = task.result; const final = result ? `<section class="workline-section"><strong>这条工作线的当前产物</strong>${renderStructuredResult(result)}<details class="workline-detail"><summary>查看完整结构化数据</summary><pre>${esc(JSON.stringify(result,null,2))}</pre></details></section>` : ''; const next = pending ? '<div class="workline-next">当前停在这一轮追问。你提交后，Agent 会继续读取项目资料、补齐产品卡片，并把新内容追加到下面的记录中。</div>' : result ? '<div class="workline-next">这一轮已经有结果。你可以继续补充、另开一条工作线，或把当前产物交给用户试用和独立评审。</div>' : '<div class="workline-next">Agent 正在读取项目上下文并组织下一轮问题；当前工作线会持续保留，离开页面后可以从看板恢复。</div>'; box.innerHTML = `<div class="result-head"><strong>${task.status === 'completed' ? '这条工作线已形成阶段性结果' : task.status === 'waiting_input' ? '这条工作线等你补充' : '这条工作线正在推进'}</strong>${chip(task.status)}</div><div class="result-body"><div class="workline-panel"><div class="workline-head"><div><h3>工作线：${esc(worklineText(task.goal || task.task_type || '未命名工作线', 120))}</h3><p>下面是这条任务已保存的产品卡片、追问回答和运行节点；它与当前项目绑定，不会和其他工作线混在一起。</p></div>${chip(task.status)}</div><div class="workline-stage">${stageHtml}</div><section class="workline-section"><strong>已经形成的产品卡片</strong><small>每次回答都会沉淀到这里；没有确认的部分会明确显示为待补全。</small><div class="workline-cards">${worklineCards(task,stage)}</div></section>${action}<section class="workline-section"><strong>你们已经讨论过什么</strong><small>这里显示已持久化的 PM 输入、Agent 追问、你的回答，以及关键工具节点。</small><div class="conversation">${worklineConversation(task)}</div></section>${final}${next}</div></div>`; if (state.activeTask?.id === task.id) { const footer = document.querySelector('#agentForm .form-footer small'); if (footer) footer.textContent = '当前工作线记录在下方；仍可继续填写，另开一条并行工作线。'; } box.querySelectorAll('[data-input]').forEach(button => button.onclick = async () => { const responses = {}; box.querySelectorAll('[data-question]').forEach(input => responses[input.dataset.question] = input.value); try { button.disabled = true; await api('/api/agents/update',{method:'POST',body:JSON.stringify({action:'provide_input',task_id:task.id,input_id:button.dataset.input,responses})}); const detail = await api(`/api/agents/task?id=${encodeURIComponent(task.id)}`); state.activeTask = detail; displayTask(detail); pollTask(task.id); } catch (error) { toast(error.message); button.disabled = false; } }); box.querySelectorAll('[data-approve]').forEach(button => button.onclick = async () => { try { button.disabled = true; await api('/api/agents/update',{method:'POST',body:JSON.stringify({action:'decide_approval',task_id:task.id,approval_id:button.dataset.approve,approved:button.dataset.value==='true'})}); pollTask(task.id); } catch (error) { toast(error.message); button.disabled = false; } }); }
    async function pollTask(id) { for (let i=0;i<160;i++) { await new Promise(resolve => setTimeout(resolve,1400)); try { const task = await api(`/api/agents/task?id=${encodeURIComponent(id)}`); state.activeTask = task; displayTask(task); if (['completed','blocked','failed','cancelled','waiting_input','waiting_approval'].includes(task.status)) { await loadProjectData(); return; } } catch (error) { toast(error.message); return; } } toast('运行时间较长，结果仍会继续写入当前项目；你可以稍后从最近记录打开。'); }
    function renderProject() { setActiveView('project'); const overview = state.overview || {}; const items = activeMaterials(); const intake = state.intake || {}; $('#view-project').innerHTML = `<div class="project-page">${projectHeader('PROJECT CONTEXT','这里是项目的长期上下文。你可以上传资料、补充背景，让后面的 Agent 先知道项目现在走到哪里。')}<div class="project-info"><div class="metric"><span>当前阶段</span><strong>${esc(stageLabel(state.project?.stage))}</strong></div><div class="metric"><span>资料数量</span><strong>${items.length} 份</strong></div><div class="metric"><span>最近进展</span><strong>${esc((overview.current?.step || '尚未开始').slice(0,22))}</strong></div></div><div class="project-context-grid"><div class="panel"><h3>项目资料</h3><p class="panel-sub">文件会放进当前项目的资料区；链接先登记来源，不会假装已经读取。支持文件、文件夹和 ZIP。</p><div class="upload-zone"><h4>添加资料</h4><p>上传 PRD、Markdown、JSON、图片、HTML、ZIP，或粘贴飞书、Figma、GitHub 链接。</p><div class="upload-actions"><label>选择文件<input id="projectFiles" type="file" multiple></label><label>选择文件夹<input id="projectFolder" type="file" multiple webkitdirectory directory></label><button class="button small" id="addSourceButton">添加链接</button></div><div id="pendingSources"></div></div><div class="source-list">${items.length ? items.map(item => `<div class="source-row"><strong title="${esc(item.name || item.path || '')}">${esc(item.name || item.path || '未命名资料')}</strong><small>${esc(item.status || item.kind || '已导入')}</small></div>`).join('') : '<div class="empty">这个项目还没有资料。你也可以直接去 Agent 页面开始讨论。</div>'}</div></div><div class="panel"><h3>AI 看到的项目现状</h3><p class="panel-sub">资料上传后先由 AI 生成草稿，你确认后才作为当前项目上下文使用。</p><div class="analysis">${esc(intake.confirmed_analysis || intake.analysis || '还没有项目现状分析。上传资料后，点击“分析当前资料”。')}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="button primary small" id="analyzeProject">分析当前资料</button>${intake.analysis ? '<button class="button small" id="confirmProject">确认作为项目上下文</button>' : ''}</div>${intake.pm_notes?.length ? `<div class="panel-sub" style="     function bindProjectActions() { const files = $('#projectFiles'); const folder = $('#projectFolder'); const pending = $('#pendingSources'); let selected = []; function showPending() { pending.innerHTML = selected.length ? `<div class="panel-sub" style="margin:12px 0 0">待上传：${selected.map(file => esc(file.name)).join('、')}</div><button class="button primary small" id="uploadNow" style="margin-top:8px">上传到当前项目</button>` : ''; $('#uploadNow')?.addEventListener('click', uploadSelected); } files.onchange = () => { selected = [...selected, ...files.files]; showPending(); }; folder.onchange = () => { selected = [...selected, ...folder.files]; showPending(); }; async function uploadSelected() { if (!selected.length) return; const button = $('#uploadNow'); button.disabled = true; for (const file of selected) { const base64 = await new Promise((resolve,reject) => { const reader = new FileReader(); reader.onload = () => resolve(String(reader.result).split(',')[1]); reader.onerror = reject; reader.readAsDataURL(file); }); await api('/api/materials/upload',{method:'POST',body:JSON.stringify({name:file.name,relative_path:file.webkitRelativePath || file.name,source_kind:'project_import',material_version:state.project?.version || 'v0.1',content_base64:base64})}); } toast(`已上传 ${selected.length} 份资料`); await loadProjectData(); renderProject(); } $('#addSourceButton').onclick = async () => { const url = window.prompt('粘贴一个公开链接、飞书或 Figma 链接'); if (!url) return; try { await api('/api/project/import',{method:'POST',body:JSON.stringify({sources:[url],material_version:state.project?.version || 'v0.1'})}); await loadProjectData(); renderProject(); toast('来源已登记'); } catch (error) { toast(error.message); } }; $('#analyzeProject').onclick = () => runIntake('analyze'); $('#confirmProject')?.addEventListener('click', () => runIntake('confirm')); $('#saveNote').onclick = () => runIntake('save_note', {note:$('#pmNote').value}); }
    function formatBytes(bytes) { if (bytes < 1024) return `${bytes} B`; if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`; if (bytes < 1024 * 1024 * 1024) return `${(bytes / 1024 / 1024).toFixed(1)} MB`; return `${(bytes / 1024 / 1024 / 1024).toFixed(2)} GB`; }
    function upgradeProjectUploads() { const zone = $('.upload-zone'); if (!zone || zone.dataset.uploadV2) return; zone.dataset.uploadV2 = 'true'; const actions = zone.querySelector('.upload-actions'); const pending = $('#pendingSources'); actions.className = 'upload-actions-v2'; actions.innerHTML = '<label>选择文件<input id="projectFilesV2" type="file" multiple accept=".md,.txt,.json,.yaml,.yml,.html,.htm,.csv,.png,.jpg,.jpeg,.webp,.gif,.zip,.fig,.pdf"></label><label>选择文件夹<input id="projectFolderV2" type="file" multiple webkitdirectory directory></label>'; const sourceBox = document.createElement('div'); sourceBox.className = 'source-link-box'; sourceBox.innerHTML = '<div class="source-link-row"><input id="projectSourceUrl" type="url" placeholder="粘贴 Figma、飞书、GitHub 或公开网页链接"><button class="button small" id="projectSourceAdd" type="button">登记来源</button></div><small>链接会保留在当前项目，但只有已连接的读取工具才会真正读取内容；未授权的 Figma / 飞书不会被假装看过。</small>'; actions.insertAdjacentElement('afterend', sourceBox); let selected = []; let uploading = false; const addFiles = fileList => { const existing = new Set(selected.map(file => `${file.webkitRelativePath || file.name}:${file.size}:${file.lastModified}`)); [...fileList].forEach(file => { const key = `${file.webkitRelativePath || file.name}:${file.size}:${file.lastModified}`; if (!existing.has(key)) selected.push(file); }); renderQueue(); }; const renderQueue = () => { const total = selected.reduce((sum, file) => sum + file.size, 0); pending.innerHTML = selected.length ? `<div class="upload-queue"><div class="upload-queue-head"><span>待上传 ${selected.length} 份</span><span>${formatBytes(total)}</span></div><div class="upload-queue-list">${selected.slice(0,80).map(file => `<div class="upload-queue-item"><span title="${esc(file.webkitRelativePath || file.name)}">${esc(file.webkitRelativePath || file.name)}</span><span>${formatBytes(file.size)}</span></div>`).join('')}${selected.length > 80 ? `<div class="upload-queue-item"><span>还有 ${selected.length - 80} 份文件</span><span>将继续上传</span></div>` : ''}</div><button class="button primary small" id="uploadNowV2" type="button" style="margin-top:11px">开始分片上传</button></div>` : '<div class="upload-note">支持单个文件最大 500MB。文件夹不需要压缩，直接选择文件夹即可；上传会保留文件夹相对路径。</div>'; $('#uploadNowV2')?.addEventListener('click', uploadSelected); }; const readChunk = (file, start, end) => new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(String(reader.result).split(',')[1]); reader.onerror = reject; reader.readAsDataURL(file.slice(start, end)); }); async function uploadSelected() { if (!selected.length || uploading) return; uploading = true; const button = $('#uploadNowV2'); if (button) button.disabled = true; try { for (let index = 0; index < selected.length; index += 1) { const file = selected[index]; if (!file.size || file.size > 500 * 1024 * 1024) throw new Error(`${file.name}：文件为空或超过 500MB`); const chunkSize = 4 * 1000 * 1000; const totalChunks = Math.ceil(file.size / chunkSize); const uploadId = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`).replace(/[^A-Za-z0-9_-]/g, ''); for (let chunkIndex = 0; chunkIndex < totalChunks; chunkIndex += 1) { if (button) button.textContent = `上传 ${index + 1}/${selected.length} · ${Math.round((chunkIndex / totalChunks) * 100)}%`; const content = await readChunk(file, chunkIndex * chunkSize, Math.min(file.size, (chunkIndex + 1) * chunkSize)); await api('/api/materials/upload-chunk', {method:'POST', body:JSON.stringify({upload_id:uploadId, chunk_index:chunkIndex, total_chunks:totalChunks, name:file.name, relative_path:file.webkitRelativePath || file.name, source_kind:'project_import', material_version:state.project?.version || 'v0.1', content_base64:content})}); } } selected = []; toast('项目资料已上传'); await loadProjectData(); renderProject(); } catch (error) { toast(`上传失败：${error.message}`); } finally { uploading = false; } } $('#projectFilesV2').onchange = event => addFiles(event.target.files); $     function renderWorkflow() { setActiveView('workflow'); const steps = ['项目上下文预检','做产品：问题、用户与 Bet','用户试用：找体验问题','独立评审：给出继续 / 收窄 / 暂停','PM 决策门','PRD、设计任务与 Demo','交付前用户走查','交付评审']; $('#view-workflow').innerHTML = `<div class="workflow-page">${projectHeader('ONE WORKFLOW','完整流程适合已经明确要推进一件事时使用。它会在关键 PM 决策门停下来，不会替你自动拍板。')}<div class="workflow-layout"><form class="form-panel" id="workflowForm"><h3>这次完整推进什么</h3><div class="field"><label>目标或想法</label><textarea name="goal" required placeholder="例如：把一个已经讨论过的陪伴功能推进到可评审的产品方案"></textarea></div><div class="field"><label>最终要支持什么决定</label><textarea name="decision" class="short" required placeholder="例如：是否进入用户验证和交付准备"></textarea></div><div class="form-footer"><small>完整流程会调用四个 Agent，并保留每个阶段的结构化结果。</small><button class="button primary" type="submit">启动完整流程 →</button></div></form><div class="panel"><h3>流程会怎么走</h3><p class="panel-sub">每一步都把结果交给下一步，遇到证据不足会说明缺口。</p><div class="flow-list">${steps.map((step,index) => `<div class="flow-step"><span class="step-num">${index+1}</span><div><strong>${step}</strong><small>${index===4||index===7?'在这里等待 PM 确认':'完成后生成结构化交接结果'}</small></div></div>`).join('')}</div></div></div><div id="workflowResult"></div></div>`; $('#workflowForm').onsubmit = startWorkflow; const recent = state.overview?.workflow_runs?.[0]; if (recent) { state.activeRun = recent; displayWorkflow(recent); if (!['completed','blocked','failed','cancelled','waiting_input','waiting_approval'].includes(recent.status)) pollWorkflow(recent.id); } }

    function simpleMarkdown(markdown) { const lines = String(markdown || '').split(/\r?\n/); let html = ''; let list = false; const closeList = () => { if (list) { html += '</ul>'; list = false; } }; lines.forEach(line => { const value = line.trim(); if (!value) { closeList(); return; } if (/^###\s+/.test(value)) { closeList(); html += `<h3>${esc(value.replace(/^###\s+/, ''))}</h3>`; return; } if (/^##\s+/.test(value)) { closeList(); html += `<h2>${esc(value.replace(/^##\s+/, ''))}</h2>`; return; } if (/^#\s+/.test(value)) { closeList(); html += `<h1>${esc(value.replace(/^#\s+/, ''))}</h1>`; return; } if (/^[-*]\s+/.test(value)) { if (!list) { html += '<ul>'; list = true; } html += `<li>${esc(value.replace(/^[-*]\s+/, ''))}</li>`; return; } if (/^>\s?/.test(value)) { closeList(); html += `<blockquote>${esc(value.replace(/^>\s?/, ''))}</blockquote>`; return; } closeList(); html += `<p>${esc(value).replace(/`([^`]+)`/g, '<code>$1</code>')}</p>`; }); closeList(); return html || '<div class="document-empty">文档没有可展示内容。</div>'; }

为，再讨论怎么优化。" data-shaper-type="optimization">我想优化功能</button></div><div class="shaper-context"><div class="shaper-context-head"><span>当前项目会自动带入</span><span>${esc(stageLabel(state.project?.stage))} · ${esc(state.project?.version || 'v0.1')}</span></div><div class="shaper-context-copy">目标人群线索：${esc(audience)} · ${esc(materials)} · 最近工作和历史 Agent 记忆会一起读取。需要外部事实时，会查询公开网页和 Reddit；小红书、微博、X 需登录会话或导出文件。</div></div><div class="shaper-progress"><div class="shaper-progress-step active"><i></i><span>想法接收</span></div><div class="shaper-progress-step"><i></i><span>用户与问题</span></div><div class="shaper-progress-step"><i></i><span>产品方向</span></div><div class="shaper-progress-step"><i></i><span>MVP 与流程</span></div><div class="shaper-progress-step"><i></i><span>Bet 验证</span></div><div class="shaper-progress-step"><i></i><span>产品蓝图</span></div></div><details class="shaper-advanced"><summary>补充背景（可选，不影响先开始）</summary><div class="field" style="margin-top:12px"><label>你希望这次先得到什么</label><textarea class="short" name="decision" placeholder="例如：先判断方向，或先形成一个可以给用户体验团看的产品草稿"></textarea></div><div class="field"><label>你已经想到的用户 / 问题</label><textarea class="short" name="shaper_context" placeholder="想到什么写什么，没有可以留空"></textarea></div><div class="field"><label>不能碰的边界或约束</label><textarea class="short" name="constraints" placeholder="例如：不做交易、不接真实支付、不改变现有核心流程"></textarea></div><div class="field"><label>已有资料路径</label><input name="materials" placeholder="可填写项目资料路径，用逗号分隔"></div></details><div class="form-footer"><small>第一轮不会直接生成正式 PRD；我会先和你把产品形态搭起来。</small><button class="button primary" type="submit">开始一起梳理 →</button></div></div>`; const setType = (type, mode) => { form.querySelector('[name=work_type]').value = type; form.querySelector('[name=mode]').value = mode || (type === 'new_product' ? 'new_product' : 'existing_feature'); form.querySelectorAll('[data-shaper-type]').forEach(item => item.classList.toggle('active', item.dataset.shaperType === type)); refreshShaperProgress(); }; form.querySelectorAll('[data-shaper-type]').forEach(button => button.onclick = () => setType(button.dataset.shaperType, button.dataset.shaperMode)); form.querySelectorAll('[data-shaper-prompt]').forEach(button => button.onclick = () => { setType(button.dataset.shaperType, button.dataset.shaperType === 'new_product' ? 'new_product' : 'existing_feature'); form.querySelector('[name=goal]').value = button.dataset.shaperPrompt; form.querySelector('[name=goal]').focus(); }); form.onsubmit = startAgent; refreshShaperProgress(); }
    function bindQuickOptions() { document.querySelectorAll('[data-quick-field]').forEach(button => { if (button.dataset.bound) return; button.dataset.bound = 'true'; button.onclick = () => { const fieldName = button.dataset.quickField === 'phase' ? 'phase' : button.dataset.quickField; const input = document.querySelector(`#agentForm [name="${fieldName}"]`); if (!input) return; const value = button.dataset.quickValue; if (input.tagName === 'SELECT') { const option = [...input.options].find(item => item.textContent === value || item.value === value); if (option) input.value = option.value; } else if (fieldName === 'users' && input.value && !input.value.includes(value)) input.value += `、${value}`; else input.value = value; button.classList.toggle('selected'); }; }); }
    function structuredItems(result, keys) { for (const key of keys) { const value = result?.[key]; if (Array.isArray(value) && value.length) return value; } return []; }
    function itemText(item) { if (typeof item === 'string') return item; if (!item || typeof item !== 'object') return String(item ?? ''); return item.statement || item.title || item.summary || item.claim || item.description || item.question || item.action || item.path || JSON.stringify(item); }
    function renderStructuredResult(result) { const conclusion = result?.verdict || result?.decision || result?.summary || result?.title || '已生成结构化结果'; const findings = structuredItems(result,['conclusions','findings','opportunities','signals']); const risks = structuredItems(result,['risks','limitations','gaps','blocking_findings']); const evidence = structuredItems(result,['evidence_ledger','evidence','sources']); const next = structuredItems(result,['next_steps','recommended_actions','research_questions','open_questions','recommended_handoffs']); const block = (title, items, className='') => items.length ? `<section class="result-block ${className}"><div class="result-block-head"><span>${esc(title)}</span><em>${items.length}</em></div><ul class="result-list">${items.slice(0,8).map(item => `<li>${esc(itemText(item))}</li>`).join('')}</ul></section>` : ''; const artifacts = structuredItems(result,['artifacts']); return `<div class="result-structured"><div class="result-hero"><span class="result-kicker">结论先看</span><strong>${esc(conclusion)}</strong>${result?.confidence ? `<small>信心：${esc(result.confidence)}</small>` : ''}</div><div class="result-grid">${block('关键判断',findings,'result-positive')}${block('风险与缺口',risks,'result-risk')}${block('证据与来源',evidence,'result-evidence')}${block('下一步',next,'result-next')}</div>${artifacts.length ? `<div class="result-artifacts"><span>已产生的产物</span>${artifacts.slice(0,6).map(item => `<code>${esc(itemText(item))}</code>`).join('')}</div>` : ''}</div>`; }
    function polishResultView() { const body = document.querySelector('#agentResult .result-body'); const result = state.activeTask?.result; if (!body || !result || body.dataset.polished) return; [...body.children].filter(child => ['H3','UL'].includes(child.tagName)).forEach(child => child.remove()); const structured = document.createElement('div'); structured.innerHTML = renderStructuredResult(result); const details = body.querySelector('details'); if (details) body.insertBefore(structured.firstElementChild, details); else body.appendChild(structured.firstElementChild); body.dataset.polished = 'true'; }
    function uxAudienceDescription(name) { return ({'唯粉':'重视成员专属感和一致性；群发感、别的成员乱入会明显减分。','团粉':'关注成员是否完整、关系是否平衡；只偏向一个成员会引起抵触。','妈粉':'更在意守护、成长和安全；恋爱化、诱导付费和过度暧昧是主要雷点。','事业粉':'关注产品是否真正帮助作品、应援或长期发展；拟社会陪伴可能被认为喧宾夺主。','CP粉':'关注双人关系和互动语境；单人恋爱式陪伴可能被认为破坏 CP 体验。','颜粉':'第一眼视觉和内容质感决定是否留下；粗糙界面或复杂流程会快速劝退。','新用户':'还没有形成习惯，先看懂价值、能否低成本完成第一次体验。','高频回访用户':'已经有固定使用路径，更在意改动是否破坏习惯和复访理由。'})[name] || '来自当前项目资料或记忆的用户线索，Agent 会先按项目事实理解，不把标签直接当成真实证据。'; }
    function polishUxReviewView() { const form = $('#agentForm'); if (!form || state.activeAgent?.id !== 'user-experience-reviewer' || form.dataset.uxReviewBuilder) return; form.dataset.uxReviewBuilder = 'true'; const goalField = form.querySelector('[name=goal]')?.closest('.field'); const decisionField = form.querySelector('[name=decision]')?.closest('.field'); const goal = form.querySelector('[name=goal]'); const decision = form.querySelector('[name=decision]'); if (goalField && goal) { goalField.querySelector('label').innerHTML = '要让用户试用什么？ <small>功能、方案、PRD、Demo 都可以</small>'; goal.placeholder = '例如：请用项目核心用户和欧美 CP 粉，走查空窗期陪伴功能'; } if (decisionField && decision) { decisionField.querySelector('label').innerHTML = '看完后我想决定什么？ <small>可留空，Agent 会帮你整理</small>'; decision.required = false; decision.placeholder = '例如：哪些地方必须修改，是否可以继续进入下一阶段'; } ['review_scope','users','region','age','focus'].forEach(name => form.querySelector(`[name="${name}"]`)?.closest('.field')?.remove()); const profileSegments = (state.project?.profile?.audience_segments || []).slice(0,4); const core = profileSegments.length ? profileSegments : ['项目核心用户尚未沉淀']; const comparison = ['唯粉','团粉','妈粉','事业粉','CP粉','颜粉','新用户','高频回访用户']; const coreHtml = core.map(name => `<button type="button" class="ux-audience-option selected" data-ux-audience="core" data-ux-value="${esc(name)}" aria-pressed="true"><strong>${esc(name)}</strong><span>${esc(uxAudienceDescription(name))}</span></button>`).join(''); const comparisonHtml = comparison.map(name => `<button type="button" class="ux-audience-option" data-ux-audience="comparison" data-ux-value="${esc(name)}" aria-pressed="false"><strong>${esc(name)}</strong><span>${esc(uxAudienceDescription(name))}</span></button>`).join(''); const builder = document.createElement('div'); builder.className = 'ux-review-builder'; builder.innerHTML = `<div class="ux-review-builder-head"><strong>这次怎么试用</strong><span>先召回当前项目已经沉淀的核心用户，再按需要加入一组对照受众。模拟用户是推演，不是真人结论。</span></div><div class="ux-review-section"><label>评审范围</label><small>三个范围不是一回事：功能看一个改动，版本看一次发布里的多项改动，产品路径看从进入到退出的完整体验。</small><select class="ux-scope-select" name="review_scope"><option value="feature">一个功能：只看这次功能的使用路径</option><option value="version">一个版本：看本次版本的全部改动是否互相影响</option><option value="product">整个产品：从进入、使用、复访到退出完整走查</option><option value="prd">一份 PRD：检查规则和状态是否能被用户理解</option><option value="demo">一个 HTML Demo：实际点击和检查页面状态</option><option value="figma">一份 Figma：检查界面结构和关键路径</option></select></div><div class="ux-review-section"><label>项目核心用户 <small>默认召回</small></label><small>这些来自当前项目资料 / 记忆。它们代表“这个产品本来就应该先服务谁”。</small><div class="ux-audience-list">${coreHtml}</div></div><div class="ux-review-section"><label>额外对照受众 <small>可选，多选</small></label><small>用于看看产品对其他人是否成立；它们不会覆盖项目核心用户。</small><div class="ux-audience-list">${comparisonHtml}</div></div><div class="ux-review-grid"><label>地区语境<select name="region"><option>不指定</option><option>中国大陆</option><option>韩国 / 日本</option><option>东南亚</option><option>欧美</option><option>全球多地区</option></select></label><label>年龄 / 风险视角<select name="age"><option>不指定</option><option>未成年风险视角</option><option>18-24 岁</option><option>25-34 岁</option><option>35 岁以上</option></select></label></div><div class="ux-review-section"><label>要不要查公开用户语境？</label><small>选择 Reddit / 公开网页后，Agent 会把来源、日期和限制写进结果；小红书、微博、X 仍需要登录会话或导出资料。</small><select class="ux-evidence-select" name="ux_evidence_mode"><option value="project_and_simulation">先用项目资料 + 模拟用户推演</option><option value="public_research">项目资料 + Reddit / 公开网页背景核验</option><option value="provided_only">只用我提供的材料，不主动查外部</option></select></div><div class="ux-audience-summary" data-ux-summary>正在读取当前项目核心用户。</div><input type="hidden" name="users"><input type="hidden" name="focus"><div class="ux-review-note">结果会分别标记：项目事实、外部来源、专业推断、模拟反应和仍需真人验证的问题。</div></div>`; const materialsField = form.querySelector('[name=materials]')?.closest('.field'); if (materialsField) materialsField.before(builder); else form.querySelector('.form-footer')?.before(builder); const sync = () => { const selected = [...builder.querySelectorAll('.ux-audience-option.selected')]; const coreSelected = selected.filter(item => item.dataset.uxAudience === 'core').map(item => item.dataset.uxValue); const comparisonSelected = selected.filter(item => item.dataset.uxAudience === 'comparison').map(item => item.dataset.uxValue); const region = builder.querySelector('select[name=region]').value; const age = builder.querySelector('select[name=age]').value; const scope = builder.querySelector('select[name=review_scope]').value; const evidence = builder.querySelector('select[name=ux_evidence_mode]').value; form.querySelector('[name=users]').value = `项目核心用户：${coreSelected.join('、') || '未指定'}；额外对照受众：${comparisonSelected.join('、') || '无'}`; form.querySelector('[name=focus]').value = `证据策略：${evidence === 'public_research' ? '需要查询 Reddit / 公开网页作为背景核验' : evidence === 'provided_only' ? '只使用 PM 提供的材料' : '以项目资料和模拟用户推演为主'}；核心用户：${coreSelected.join('、') || '未指定'}；对照受众：${comparisonSelected.join('、') || '无'}；地区：${region}；年龄视角：${age}`; builder.querySelector('[data-ux-summary]').textContent = `本次会先看：${coreSelected.join('、') || '未指定核心用户'}；${comparisonSelected.length ? `再对照：${comparisonSelected.join('、')}；` : ''}地区：${region}。${evidence === 'public_research' ? 'Agent 会尝试用 Reddit / 公开网页核验语境，但不会把帖子当成真人验证。' : 'Agent 会明确区分模拟推演和真实证据。'}`; }; builder.querySelectorAll('[data-ux-audience]').forEach(button => button.onclick = () => { button.classList.toggle('selected'); button.setAttribute('aria-pressed', button.classList.contains('selected')); sync(); }); builder.querySelectorAll('select').forEach(select => select.onchange = sync); sync(); }
    function polishAgentView() { const tabs = document.querySelector('#agentForm .mode-tabs'); if (tabs && !tabs.dataset.simplified) { const hidden = document.querySelector('#agentForm [name="mode"]'); const select = document.createElement('select'); select.className = 'mode-select'; select.setAttribute('aria-label', '工作方式'); tabs.querySelectorAll('[data-mode]').forEach(button => { const option = document.createElement('option'); option.value = button.dataset.mode; option.textContent = button.textContent; select.appendChild(option); }); select.value = hidden?.value || select.options[0]?.value || ''; select.addEventListener('change', () => { if (hidden) hidden.value = select.value; }); tabs.dataset.simplified = 'true'; tabs.replaceWith(select); } bindQuickOptions(); const pre = document.querySelector('#agentResult .result-body > pre'); if (pre) { const details = document.createElement('details'); details.className = 'raw-result'; const summary = document.createElement('summary'); summary.textContent = '查看完整结构化结果'; pre.replaceWith(details); details.append(summary, pre); } polishResultView(); }
    function polishProjectView() { const grid = document.querySelector('#view-project .project-context-grid'); if (!grid || grid.querySelector('.project-profile-panel')) return; const profile = state.project?.profile || {}; const memoryData = state.overview?.memory || {}; const memory = [...(memoryData.memories || []), ...(memoryData.turns || [])]; const segments = profile.audience_segments || []; const recent = profile.recent_work || []; const panel = document.createElement('div'); panel.className = 'panel project-profile-panel'; panel.innerHTML = `<h3>项目已经沉淀了什么</h3><p class="panel-sub">这些内容会被四个 Agent 和 Codex 的 PM 入口共同读取。</p><div class="profile-line"><strong>目标人群</strong><span>${esc(segments.join('、') || '还没有明确')}</span></div><div class="profile-line"><strong>产品线</strong><span>${esc((profile.product_lines || []).join('、') || '还没有明确')}</span></div><div class="profile-line"><strong>最近工作</strong><span>${esc(recent.join('；') || '还没有记录')}</span></div><div class="profile-memory"><strong>最近记忆</strong>${memory.slice(0,4).map(item => `<div>${esc(item.content || item.text || item.role || '')}</div>`).join('') || '<div>网页和 Codex 通过 pm_memory 写入后会显示在这里。</div>'}</div>`; grid.appendChild(panel); }

    async function init() { bindTaskPet(); try { let projects = await api('/api/projects',{headers:{'X-Project-ID':''}}); if (!state.projectId || !projects.projects.some(project => project.id === state.projectId)) { const out = await api('/api/projects',{method:'POST',headers:{'X-Project-ID':''},body:JSON.stringify({temporary:true,name:'临时工作区'})}); state.projectId = out.project.id; const url = new URL(location.href); url.searchParams.set('project',state.projectId); history.replaceState({},'',url); projects = await api('/api/projects',{headers:{'X-Project-ID':''}}); } $('#projectSelect').innerHTML = projects.projects.map(project => `<option value="${esc(project.id)}" ${project.id===state.projectId?'selected':''}>${esc(project.name)}${project.temporary?' · 临时':''}</option>`).join(''); $('#projectSelect').onchange = event => { const url = new URL(location.href); url.searchParams.set('project',event.target.value); url.searchParams.set('page','home'); location.href = url; }; $('#newProjectButton').onclick = () => $('#projectModal').classList.add('open'); $('#cancelProject').onclick = () => $('#projectModal').classList.remove('open'); $('#projectForm').onsubmit = async event => { event.preventDefault(); const form = new FormData(event.target); try { const out = await api('/api/projects',{method:'POST',headers:{'X-Project-ID':''},body:JSON.stringify({id:form.get('id'),name:form.get('name'),temporary:form.get('temporary')==='on'})}); location.href = `?project=${encodeURIComponent(out.project.id)}&page=project`; } catch (error) { toast(error.message); } }; $('#menuButton').onclick = () => document.body.classList.toggle('nav-open'); const status = await api('/api/ai/status',{headers:{'X-Project-ID':''}}); $('#gatewayDot').className = `status-dot ${status.configured?'ok':'warn'}`; $('#gatewayText').textContent = status.configured ? `${status.model} · ${status.reasoning_effort}` : '网关未配置'; await loadProjectData(); const catalog = await api('/api/catalog'); state.catalog = catalog; render(); renderTaskPet(); refreshTaskPetData(); } catch (error) { toast(error.message); $('#view-home').innerHTML = `<div class="panel"><h3>工作台暂时无法读取</h3><p class="panel-sub">${esc(error.message)}。请确认本地服务已启动。</p></div>`; setActiveView('home'); } }

    async function restorePersistentView() { if (!state.taskId) return; try { const task = await api(`/api/agents/task?id=${encodeURIComponent(state.taskId)}`); state.activeTask = task; const page = runtimeToPackage[task.assigned_agent]; if (page && state.page !== page) { state.page = page; const url = new URL(location.href); url.searchParams.set('page', page); history.replaceState({}, '', url); render(); } displayTask(task); if (!['completed','blocked','failed','cancelled','waiting_input','waiting_approval'].includes(task.status)) pollTask(task.id); } catch (error) { toast(`无法恢复上次任务：${error.message}`); } }
